      sign.textContent = '−';
      sign.classList.add('del-mark');
    } else {
      sign.textContent = '\u00a0';
    }

    const code = document.createElement('span');
    code.className = 'code';
    fillCode(code, r.raw, path);

    line.appendChild(oldLn);
    line.appendChild(newLn);
    line.appendChild(sign);
    line.appendChild(code);
    return line;
  }

  // 把 hunk 的行序列折成「左旧 / 右新」成对的行：
  // 连续的 `-` 段和 `+` 段按下标配对，多出来的一侧配 null（渲染成空占位）。
  function sbsRows(rows) {
    const out = [];
    let dels = [];
    let adds = [];
    let last = null;
    const flush = () => {
      const n = Math.max(dels.length, adds.length);
      for (let k = 0; k < n; k++) out.push({ left: dels[k] || null, right: adds[k] || null });
      dels = [];
      adds = [];
      last = null;
    };
    for (const r of rows) {
      if (r.kind === 'ctx') {
        flush();
        out.push({ left: r, right: r });
      } else if (r.kind === 'nonl') {
        // "\ No newline at end of file" 跟在上一个 +/- 行所属的那一侧
        (last === 'add' ? adds : dels).push(r);
      } else if (r.kind === 'del') {
        dels.push(r);
        last = 'del';
      } else {
        adds.push(r);
        last = 'add';
      }
    }
    flush();
    return out;
  }

  // 双页里的一侧：行号 + sign + 代码。r 为 null 表示对侧没有对应行 → 空占位。
  function makeSbsCell(r, side, path) {
    const cell = document.createElement('span');
    cell.className = 'side ' + side;
    const ln = document.createElement('span');
    ln.className = 'ln ' + (side === 'left' ? 'ln-old' : 'ln-new');
    const sign = document.createElement('span');
    sign.className = 'sign';
    const code = document.createElement('span');
    code.className = 'code';

    if (!r) {
      // 空侧也要占住行号/sign 两列，左右代码列才对得齐
      cell.classList.add('empty');
      sign.textContent = '\u00a0';
    } else {
      const kind = side === 'left' ? (r.kind === 'add' ? 'ctx' : r.kind) : (r.kind === 'del' ? 'ctx' : r.kind);
      if (kind === 'del') cell.classList.add('del');
      else if (kind === 'add') cell.classList.add('add');
      else if (kind === 'nonl') cell.classList.add('nonl');
      ln.textContent = side === 'left' ? (r.old || '') : (r.new || '');
      // 双页：两侧的行号都跳同一处（这一对改动在新文件里的位置）。
      // 左侧是旧行号，直接拿去跳新文件会错位，所以统一用 r.jump。
      if (Number.isFinite(r.jump)) {
        ln.dataset.lnJump = String(r.jump);
        ln.title = S.isWorking
          ? `打开第 ${r.jump} 行（可编辑）`
          : `打开第 ${r.jump} 行（该提交时的快照，只读）；Alt+点击 = 打开当前工作区文件`;
      }
      const rc = r.raw && r.raw.length ? r.raw[0] : ' ';
      if (rc === '+') { sign.textContent = '+'; sign.classList.add('add-mark'); }
      else if (rc === '-') { sign.textContent = '−'; sign.classList.add('del-mark'); }
      else sign.textContent = '\u00a0';
      cell.dataset.raw = r.raw;
      fillCode(code, r.raw, path);
    }
    cell.appendChild(ln);
    cell.appendChild(sign);
    cell.appendChild(code);
    return cell;
  }

  function makeSbsRow(pair, path, hIdx) {
    const line = document.createElement('div');
    const L = pair.left;
    const R = pair.right;
    const isAdd = !!(R && R.kind === 'add');
    const isDel = !!(L && L.kind === 'del');
    line.className = 'hl sbs ' + (isAdd ? 'add' : isDel ? 'del' : 'ctx');
    line.dataset.h = String(hIdx);
    if (L && L.old) line.dataset.lnOld = L.old;
    if (R && R.new) line.dataset.lnNew = R.new;
    // 这一对改动对应新文件的第几行（重算后按行还原滚动位置要用，见 scrollToLine）
    const jump = (R && R.jump) || (L && L.jump);
    if (Number.isFinite(jump)) line.dataset.lnJump = String(jump);
    // 送 Chat 用的统一格式原文：配对行就是「-旧 +新」两行
    if (L && R && L.raw !== R.raw) line.dataset.raw = L.raw + '\n' + R.raw;
    else line.dataset.raw = (L || R).raw;

    line.appendChild(makeSbsCell(L, 'left', path));
    line.appendChild(makeSbsCell(R, 'right', path));
    return line;
  }

  function renderDiff(opts) {
    // 展开/收起只是同一份 diff 重画：必须先把「停在哪一行」记下来，
    // 否则下面一清空 DOM，再滚到 0，体感就是「点了展开，人被甩回文件头，条也不见了」。
    const keep = !!(opts && opts.keepScroll);
    const keepTop = keep ? topVisibleLine() : 0;
    const keepY = keep && $('#diffbody') ? $('#diffbody').scrollTop : 0;
    const head = $('#diffhead');
    const note = $('#diffnote');
    const ph = $('#placeholder');
    const body = $('#diffbody');
    head.className = 'hidden';
    head.textContent = '';
    note.className = 'hidden';
    note.textContent = '';
    body.className = 'hidden';
    body.textContent = '';
    ph.classList.remove('hidden');
    S.lastSel = null;        // diff DOM 重建，上次选区作废
    S.chgIdx = -1;           // DOM 重建，改动点下标作废
    S.changeBlocksCache = null;
    for (const el of S.chgMarkedEls) el.classList.remove('chg', 'flash');
    S.chgMarkedEls = [];
    showStatus('');          // 换文件 / 重绘时清掉「改动 2/2 · …」这种过期提示
    refreshSelButton(true);  // 早期 return 的分支也要让按钮状态正确

    const f = curFile();
    if (!f) {
      // 区分「宿主真的没下发数据」和「这个提交确实没改动」：前者是通信问题，别误导用户
      if (!S.shortSha) {
        ph.textContent = '还没有收到提交数据。\n\n（面板可能是刚从别的窗口搬过来，数据还没补发）' +
          '\n按 Esc 关闭后重开一次；若总是这样，请看 输出 → Pretty Commit 的日志。';
      } else if (S.symbolOnly.length) {
        // 最容易让人误会「工具漏文件」的一种情况，必须写清楚原因和怎么看到它们。
        // 注意 #placeholder 是 white-space: pre-line —— 缩进会被吃掉，所以用 · 当行首标记。
        const names = S.symbolOnly.slice(0, 8).map((p) => '· ' + p).join('\n');
        const more = S.symbolOnly.length > 8 ? `\n…还有 ${S.symbolOnly.length - 8} 个` : '';
        ph.textContent =
          `${S.isWorking ? '工作区' : '这个提交'}里 ${S.symbolOnly.length} 个文件只差「符号」：换行符（CRLF/LF）、` +
          `行尾空白、或文件末尾换行 —— 已按「忽略符号差异」跳过：\n\n${names}${more}` +
          `\n\n想看这些差异：按 ¶（或把设置 prettyCommit.ignoreSymbolDiffs 改成 false）。` +
          (S.hiddenUnchanged > 0 ? `\n另有 ${S.hiddenUnchanged} 个文件是纯重命名/仅权限变更。` : '');
      } else if (S.hiddenUnchanged > 0) {
        ph.textContent = `这个提交没有可显示的行级改动：${S.hiddenUnchanged} 个文件都是纯重命名/仅权限变更。` +
          '\n\n（想看全部文件：把设置 prettyCommit.hideUnchangedFiles 关掉）';
      } else {
        ph.textContent = '这个提交没有可显示的文件改动。\n\n（常见：merge 提交无冲突合并 / 只改二进制 / 空提交）';
      }
      return;
    }
    if (!S.open) {
        ph.textContent = `已折叠。\n\n点击左侧文件，展开 ${f.path} 的 diff。`;
      return;
    }

    ph.classList.add('hidden');
    head.className = '';
    head.textContent = '';
    const pathSpan = document.createElement('span');
    pathSpan.className = 'dpath';
    pathSpan.textContent = f.path;
    pathSpan.title = f.path;
    head.appendChild(pathSpan);
    const statusSpan = document.createElement('span');
    statusSpan.textContent = STATUS_NAME[f.status] || f.status;
    head.appendChild(statusSpan);
    if (!f.binary) {
      const a = document.createElement('span');
      a.className = 'add-c';
      a.textContent = `+${f.added}`;
      const d = document.createElement('span');
      d.className = 'del-c';
      d.textContent = `−${f.deleted}`;
      head.append(document.createTextNode('  '), a, document.createTextNode(' '), d);
    } else {
      const b = document.createElement('span');
      b.textContent = '[二进制]';
      head.appendChild(b);
    }
    // 一键跳到原文：在编辑器里打开这个文件（工作区 diff 就是磁盘文件本身；
    // 历史 commit 是那条历史里的同名文件，对齐当前看到的这一行）。
    const jump = document.createElement('button');
    jump.className = 'jump';
    jump.id = 'btn-jump-src';
    jump.title = '在编辑器里打开原文（o）';
    jump.textContent = S.isWorking ? '打开文件 ↗' : '打开文件（当前工作区）↗';
    jump.addEventListener('click', () => openSourceFile());
    head.appendChild(jump);
    if (!f.binary && f.hunks && f.hunks.length) {
      const xb = document.createElement('button');
      xb.className = 'jump hx-btn';
      xb.id = 'btn-expand-all';
      const opened = anyGapOpen(f);
      xb.textContent = opened ? '▲ 收起上下文' : '▼ 展开全文';
      xb.title = opened
        ? '把补进去的源码收起来，只留 git 的改动岛（e / E）'
        : '把省略的源码补进 diff，红绿行还在原位（e）';
      xb.addEventListener('click', () => toggleExpandAll(f));
      head.appendChild(xb);
    }

    const hunks = f.hunks;
    if (!hunks.length) {
      body.className = '';
      const n = document.createElement('div');
      n.className = 'note';
      n.textContent = f.binary
        ? '二进制文件：无法直接显示 diff。'
        : f.modeOnly ? '仅文件模式（权限）变更。' : '本次没有行级改动。';
      body.appendChild(n);
      return;
    }

    body.className = S.sideBySide ? 'sbs-mode' : '';
    const blob = getBlob(f.path);
    const oldLen = blob && blob.oldLines ? blob.oldLines.length : 0;
    const newLen = blob && blob.newLines ? blob.newLines.length : 0;
    body.style.setProperty('--ln-digits', String(gutterDigits(hunks, oldLen, newLen)));
    const st = fileExpand(f.path);
    const needBlob = st.full || Object.keys(st.ids || {}).length > 0;
    if (needBlob && (!blob || blob.pending) && !(blob && blob.error)) requestFileBlob(f);
    const gaps = hunkGaps(hunks, oldLen, newLen);
    const gapOpen = (g) => !!(st.full || (st.ids && st.ids[g.id]));
    const midByAfter = {};
    let headGap = null;
    let tailGap = null;
    for (const g of gaps) {
      if (g.id === 'head') headGap = g;
      else if (g.id === 'tail') tailGap = g;
      else midByAfter[g.after] = g;
    }
    const appendRows = (rows, hIdx) => {
      fillJumpTargets(rows);
      if (S.sideBySide) {
        for (const pair of sbsRows(rows)) frag.appendChild(makeSbsRow(pair, f.path, hIdx));
      } else {
        for (const r of rows) frag.appendChild(makeLine(r, f.path, hIdx));
      }
    };
    const appendGap = (g, hIdx) => {
      if (!g) return;
      const open = gapOpen(g) && blob && blob.newLines;
      // 展开后条还留着，才能点回去。先画条再画源码：收起按钮停在这段源码上头。
      frag.appendChild(makeExpandBar(g, f, open));
      if (open) appendRows(ctxRowsForGap(g, blob.oldLines, blob.newLines), hIdx);
    };
    const frag = document.createDocumentFragment();
    appendGap(headGap, 0);
    let hIdx = 0;
    for (const h of hunks) {
      frag.appendChild(makeHunkHead(h, hIdx));
      const { rows } = lineNumbers(h);
      appendRows(rows, hIdx);
      appendGap(midByAfter[hIdx], hIdx);
      hIdx++;
    }
    appendGap(tailGap, Math.max(0, hIdx - 1));
    if (f.viewTrunc) {
      const t = document.createElement('div');
      t.className = 'note notrunc';
      t.textContent = `… 该文件 diff 过长，右侧仅显示前若干 hunk（本 commit 内仍有更多改动）。`;
      frag.appendChild(t);
    }
    body.appendChild(frag);
    S.changeBlocksCache = null;
    if (S.hunkIdx >= hIdx) S.hunkIdx = 0;
    markCurHunk();
    if (keep) {
      if (!scrollToLine(Number(keepTop)) && keepY > 0) body.scrollTop = keepY;
    } else {
      body.scrollTop = 0;
    }
    refreshSelButton(true);
  }

  function markCurHunk() {
    const body = $('#diffbody');
    for (const el of body.querySelectorAll('.hh')) {
      el.classList.toggle('cur', el.dataset.h === String(S.hunkIdx));
    }
  }

  // ---------- 上下找改动点 ----------
  // 「改动块」= 连续的新增/删除行。一次修改区通常渲染成 `-…` 紧跟 `+…`，
  // 所以它们算同一个改动点；上下文行断开，hunk 头也断开。
  // `\ No newline at end of file` 附着在前一个块里（它自己不成块）。
  function changeBlocks() {
    const body = $('#diffbody');
    const blocks = [];
    let cur = null;
    for (const el of body.children) {
      if (!el.classList.contains('hl')) { cur = null; continue; }  // hunk 头 / 展开条断开
      const k = el.classList.contains('add')
        ? 'add'
        : el.classList.contains('del')
          ? 'del'
          : el.classList.contains('nonl')
            ? 'nonl'
            : 'ctx';
      if (k === 'add' || k === 'del') {
        if (cur) {
          cur.end = el;
          cur.els.push(el);
        } else {
          cur = { start: el, end: el, els: [el] };
          blocks.push(cur);
        }
      } else if (k === 'nonl') {
        if (cur) {
          cur.end = el;
          cur.els.push(el);
        }
      } else {
        cur = null;
      }
    }
    return blocks;
  }

  function getChangeBlocks() {
    if (S.changeBlocksCache) return S.changeBlocksCache;
    S.changeBlocksCache = changeBlocks();
    return S.changeBlocksCache;
  }

  // 已经用 ↑/↓ 跳过 → 用 S.chgIdx 接着走（否则短文件里所有块都在视口中线以上时，
  // 第一次「下一个」会直接跳到最后一块）。还没跳过 → 以视口顶部为锚。
  function curChangeIdx(blocks) {
    if (S.chgIdx >= 0 && S.chgIdx < blocks.length) return S.chgIdx;
    const body = $('#diffbody');
    const top = body.scrollTop + 4;
    let idx = -1;
    for (let i = 0; i < blocks.length; i++) {
      if (blocks[i].start.offsetTop < top) idx = i;
      else break;
    }
    return idx;
  }

  function markChange(blocks, idx) {
    for (const el of S.chgMarkedEls) el.classList.remove('chg', 'flash');
    S.chgMarkedEls = [];
    if (idx < 0 || idx >= blocks.length) { S.chgIdx = -1; return; }
    S.chgIdx = idx;
    S.chgMarkedEls = blocks[idx].els.slice();
    for (const el of S.chgMarkedEls) {
      el.classList.add('chg');
      el.classList.add('flash');   // 闪一下，好找
      setTimeout(() => el.classList.remove('flash'), 700);
    }
  }

  // 本文件没有可去的改动点了：翻到上一个/下一个有改动的文件
  function stepFileForChange(dir) {
    const n = S.files.length;
    for (let step = 1; step <= n; step++) {
      const i = S.idx + dir * step;
      if (i < 0 || i >= n) break;                 // 到头就停，不绕回去
      const f = S.files[i];
      if (!f || f.binary || !f.hunks.length) continue;
      S.idx = i;
      S.hunkIdx = 0;
      S.open = true;
      renderList();
      renderDiff();
      renderHeader();
      const blocks = getChangeBlocks();
      if (!blocks.length) continue;
      const target = dir > 0 ? 0 : blocks.length - 1;
      markChange(blocks, target);
      blocks[target].start.scrollIntoView({ block: 'center' });
      showStatus(`改动 ${target + 1}/${blocks.length} · ${f.path}${dir > 0 ? '（下一个文件）' : '（上一个文件）'}`);
      return;
    }
    toast(dir > 0 ? '没有更靠后的改动了' : '没有更靠前的改动了');
    showStatus(dir > 0 ? '已经是最后一处改动' : '已经是第一处改动');
  }

  function gotoChange(dir) {
    if (!S.shortSha || !S.files.length) return;
    if (!S.open) {
      S.open = true;
      renderDiff();
    }
    const blocks = getChangeBlocks();
    if (!blocks.length) { stepFileForChange(dir); return; }   // 本文件没改动，直接翻文件
    const i = curChangeIdx(blocks);
    const next = dir > 0 ? i + 1 : i - 1;
    if (next >= blocks.length) { stepFileForChange(1); return; }
    if (next < 0) { stepFileForChange(-1); return; }
    markChange(blocks, next);
    blocks[next].start.scrollIntoView({ block: 'center' });
    const f = curFile();
    showStatus(`改动 ${next + 1}/${blocks.length} · ${f ? f.path : ''}`);
  }

  function focusHunk(i) {
    const el = $('#diffbody').querySelector(`.hh[data-h="${i}"]`);
    if (el) el.scrollIntoView({ block: 'center' });
  }

  // ---------- 键盘 ----------
  window.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey || e.altKey;
    if (e.key === 'Escape') {
      vscode.postMessage({ type: 'close' });
      e.preventDefault();
      return;
    }
    // Ctrl/Cmd+L：对齐 Cursor 的「Add to Chat」——鼠标选好代码，一键加进 Chat
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'l' || e.key === 'L')) {
      sendSelection();
      e.preventDefault();
      return;
    }
    // 缩放 diff。Ctrl+= / Ctrl+- 可能被工作台抢走（它自己也用来缩放界面），
    // 所以另外给了不带修饰键的 + / - / 0，以及底栏那组按钮和 Ctrl+滚轮。
    if ((e.ctrlKey || e.metaKey) && !e.altKey) {
      if (e.key === '=' || e.key === '+') { setZoom(1); e.preventDefault(); return; }
      if (e.key === '-' || e.key === '_') { setZoom(-1); e.preventDefault(); return; }
      if (e.key === '0') { setZoom(-S.zoom); e.preventDefault(); return; }
    }
    // 输入框/按钮聚焦时别劫持字符键：Enter/Space 交给按钮默认点击
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (tag === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
    if (e.key === 'F12') {
      goToFromSelection(e.shiftKey ? 'reference' : 'definition');
      e.preventDefault();
      return;
    }
    if (mod && e.key !== 'A') return;
    if (e.repeat && ['n','p','N','P','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','c','b','[',']','r','R','e','E'].includes(e.key)) return;

    switch (e.key) {
      case 'ArrowRight': case 'n': case 'N':
        stepFile(1);
        e.preventDefault(); break;
      case 'ArrowLeft': case 'p': case 'P':
        stepFile(-1);
        e.preventDefault(); break;
      case 'ArrowDown':
        gotoChange(1);
        e.preventDefault(); break;
      case 'ArrowUp':
        gotoChange(-1);
        e.preventDefault(); break;
      case 'b':
        toggleList();
        e.preventDefault(); break;
      case '[':
        gotoChange(-1);
        e.preventDefault(); break;
      case ']':
        gotoChange(1);
        e.preventDefault(); break;
      case '+': case '=':
        setZoom(1);
        e.preventDefault(); break;
      case '-': case '_':
        setZoom(-1);
        e.preventDefault(); break;
      case '0':
        setZoom(-S.zoom);
        e.preventDefault(); break;
      case 'c':
        sendSelection();
        e.preventDefault(); break;
      case 's':
        toggleSideBySide();
        e.preventDefault(); break;
      case 'i': // invisibles：换行符 / 行尾空白这类「看不见的字符」差异
        toggleIgnoreSymbols();
        e.preventDefault(); break;
      case 't': // theme：Gerrit 浅色 / 深色 / 跟随编辑器
        cycleDiffTheme();
        e.preventDefault(); break;
      case 'd': // depth：色带深浅（淡 / 标准 / 浓）
        cycleDiffDepth(e.shiftKey ? -1 : 1);
        e.preventDefault(); break;
      case 'o':
        openSourceFile();
        e.preventDefault(); break;
      case 'e':
        toggleExpandAll(curFile());
        e.preventDefault(); break;
      case 'E':
        {
          const f = curFile();
          if (f) {
            const st = fileExpand(f.path);
            st.full = false;
            st.ids = {};
            renderDiff();
          }
        }
        e.preventDefault(); break;
      case 'r': case 'R': // refresh：回 git 重算（别处改过 / 刚存盘 / 刚 git add）；Shift+R 全部标签
        requestRefresh(e.shiftKey);
        e.preventDefault(); break;
      case 'x':
        closeActiveDoc();
        e.preventDefault(); break;
      case 'A':
        if (e.shiftKey) { vscode.postMessage({ type: 'analyze' }); e.preventDefault(); }
        break;
      case 'F':
        if (e.shiftKey) {
          const f = curFile();
          if (f) vscode.postMessage({ type: 'analyzeFile', path: f.path });
          else toast('先选中一个文件');
          e.preventDefault();
        }
        break;
    }
  });

  // 当前要送 Chat 的内容：优先鼠标选区，其次缓存的最近选区，最后退回当前 hunk
  function currentSelection() {
    const f = curFile();
    if (!f) return null;
    const body = $('#diffbody');
    const sel = window.getSelection();
    let text = null;
    if (sel && !sel.isCollapsed) text = selectedLines(sel, body, f);
    // 点浮动按钮/按清单快捷键时选区可能已收起，用缓存的最近一次兜底
    if (text == null && S.lastSel && S.lastSel.path === f.path) text = S.lastSel.text;
    if (text == null) {
      const hs = f.hunks;
      const h = hs[Math.min(S.hunkIdx, hs.length - 1)];
      if (!h) { toast('该文件没有 hunk 可发送'); return null; }
      text = [h.header, ...h.lines].join('\n');
    }
    if (!text.trim()) return null;
    return { path: f.path, text };
  }

  // ---------- 选区 / 当前 hunk 送 Chat ----------
  function sendSelection() {
    const s = currentSelection();
    if (s) vscode.postMessage({ type: 'sendSel', path: s.path, text: s.text });
  }

  function isDiffEl(el) {
    return el.classList && (el.classList.contains('hl') || el.classList.contains('hh'));
  }

  function lineElOf(node, root) {
    let n = node;
    while (n && n !== root) {
      if (isDiffEl(n)) return n;
      n = n.parentElement;
    }
    return null;
  }

  // 把 DOM 选区折算成“整行”的 diff 文本；若选区只覆盖行的一部分也发整行，
  // 开头带上起始行所在 hunk 的 @@ 头，方便 Chat 理解上下文。
  // 选区边界换算成 els 下标。注意跨行拖选时浏览器给的是「容器元素 + 子元素偏移」
  // （startContainer 就是 #diffbody 本身），此时不能按文本节点找行，要用偏移量算。
  function boundaryIndex(node, offset, root, els, isEnd) {
    if (node === root) {
      const kids = Array.prototype.slice.call(root.children);
      if (!kids.length) return -1;
      let ci = isEnd ? offset - 1 : offset;
      if (ci < 0) ci = 0;
      if (ci >= kids.length) ci = kids.length - 1;
      if (!isDiffEl(kids[ci])) { // 落在「截断」提示等非 diff 子元素上：往选区内侧找最近的行
        const step = isEnd ? -1 : 1;
        for (let i = ci; i >= 0 && i < kids.length; i += step) {
          if (isDiffEl(kids[i])) { ci = i; break; }
        }
      }
      return els.indexOf(kids[ci]);
    }
    const el = lineElOf(node, root);
    return el ? els.indexOf(el) : -1;
  }

  function selectedLines(sel, root) {
    if (!sel.rangeCount) return null;
    const els = [];
    for (const child of root.children) if (isDiffEl(child)) els.push(child);
    if (!els.length) return null;
    const range = sel.getRangeAt(0);
    let si = boundaryIndex(range.startContainer, range.startOffset, root, els, false);
    let ei = boundaryIndex(range.endContainer, range.endOffset, root, els, true);
    if (si < 0) si = 0;                       // 边界算不出来就取首/尾行，别整块丢弃
    if (ei < 0) ei = els.length - 1;
    if (si > ei) { const t = si; si = ei; ei = t; }

    // 若第一行不是 hunk 头，把起始行所在 hunk 的 @@ 头补到最前
    let headerText = null;
    if (!els[si].classList.contains('hh')) {
      const h = els[si].dataset.h;
      for (let i = si - 1; i >= 0; i--) {
        if (els[i].classList.contains('hh')) {
          if (els[i].dataset.h === h) headerText = els[i].textContent;
          break;
        }
      }
    }
    // 优先取渲染时存的原始行：行首多了两列行号，textContent 会拼成
    // "7 8 +const x = 1" 这种东西，送 Chat 必须是合法 diff。
    // .hh（hunk 头）没有 data-raw，自动走 textContent 兜底。
    const lines = els.slice(si, ei + 1).map((x) => (x.dataset.raw != null ? x.dataset.raw : x.textContent));
    if (headerText && !lines[0].startsWith('@@')) lines.unshift(headerText);
    return lines.join('\n');
  }

  // ---------- 浮动「＋ 添加到 Chat」按钮 ----------
  // 常显（有可发送内容时），有选区时高亮并显示行数 —— 避免「选区一松手按钮就没」的竞态。
  const selAdd = $('#sel-add');
  // 选区是否落在 diff 区里。跨行拖选时 anchorNode 就是 #diffbody 本身，所以要 || n === body
  function selTouchesBody(sel, body) {
    if (!sel || sel.isCollapsed || !sel.rangeCount) return false;
    const n = sel.anchorNode || sel.focusNode;
    if (!n) return false;
    return n === body || body.contains(n);
  }
  let selBtnUi = { canSend: null, hot: null, text: '' };
  let selRefreshTimer = null;

  function refreshSelButton(immediate) {
    if (immediate) {
      clearTimeout(selRefreshTimer);
      selRefreshTimer = null;
      runRefreshSelButton();
      return;
    }
    if (selRefreshTimer) return;
    selRefreshTimer = setTimeout(() => {
      selRefreshTimer = null;
      runRefreshSelButton();
    }, 80);
  }

  function runRefreshSelButton() {
    const f = curFile();
    const body = $('#diffbody');
    let selLines = null;
    if (f && S.open && body) {
      const sel = window.getSelection();
      if (sel && !sel.isCollapsed && selTouchesBody(sel, body)) {
        const t = selectedLines(sel, body, f);
        if (t) {
          selLines = t.split('\n').length;
          S.lastSel = { path: f.path, text: t };
        }
      }
    }
    const canSend = !!(f && S.open && f.hunks.length);
    const hot = selLines != null;
    const text = hot ? `＋ 添加到 Chat（${selLines} 行选区）` : '＋ 添加到 Chat';
    if (selBtnUi.canSend === canSend && selBtnUi.hot === hot && selBtnUi.text === text) return;
    selBtnUi = { canSend, hot, text };
    selAdd.classList.toggle('show', canSend);
    selAdd.classList.toggle('hot', hot);
    selAdd.textContent = text;
  }

  document.addEventListener('selectionchange', () => refreshSelButton(false));
  document.addEventListener('mouseup', () => refreshSelButton(true));
  selAdd.addEventListener('click', () => { sendSelection(); refreshSelButton(true); });

  // ---------- 控件 ----------
  $('#btn-analyze').addEventListener('click', () => vscode.postMessage({ type: 'analyze' }));
  $('#btn-analyze-file').addEventListener('click', () => {
    const f = curFile();
    if (!f) { toast('先选中一个文件'); return; }
    vscode.postMessage({ type: 'analyzeFile', path: f.path });
  });
  $('#btn-close').addEventListener('click', () => vscode.postMessage({ type: 'close' }));
  $('#btn-list').addEventListener('click', () => toggleList());
  $('#btn-prev-file').addEventListener('click', () => stepFile(-1));
  $('#btn-next-file').addEventListener('click', () => stepFile(1));
  $('#btn-prev-chg').addEventListener('click', () => gotoChange(-1));
  $('#btn-next-chg').addEventListener('click', () => gotoChange(1));
  $('#btn-sbs').addEventListener('click', () => toggleSideBySide());
  $('#btn-sym').addEventListener('click', () => toggleIgnoreSymbols());
  $('#btn-theme').addEventListener('click', (e) => {
    // Shift+点击 = 切色带深浅；普通点击 = 切主题。一个按钮两个轴向，省一格顶栏。
    if (e.shiftKey) cycleDiffDepth(1);
    else cycleDiffTheme();
  });
  $('#zoom-in').addEventListener('click', () => setZoom(1));
  $('#zoom-out').addEventListener('click', () => setZoom(-1));
  $('#zoom-info').addEventListener('click', () => setZoom(-S.zoom));   // 点百分数复位
  // 顶栏 ↻：重读 diff。Shift+点 = 所有 diff 标签一起重读（和 r / Shift+R 等价）
  $('#btn-refresh').addEventListener('click', (e) => requestRefresh(e.shiftKey));

  // Ctrl+滚轮缩放（滚轮不带 Ctrl 时照常滚动，不拦）
  document.querySelector('section').addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    setZoom(e.deltaY < 0 ? 1 : -1);
  }, { passive: false });

  $('#diffbody').addEventListener('click', (e) => {
    const hh = e.target.closest('.hh');
    if (hh && !e.ctrlKey && !e.metaKey && !e.altKey) {
      S.hunkIdx = Number(hh.dataset.h) || 0;
      markCurHunk();
      return;
    }
    // 点行号 = 在编辑器里打开这一行（精确到行）。
    //   工作区 diff → 磁盘上的真实文件（可编辑）；
    //   历史 diff   → 该提交那一刻的快照（只读）；
    //   Alt+点击（历史 diff）→ 放弃快照，直接开当前工作区里的同名文件（想改就得走这条）。
    // Ctrl/⌘+点行号不处理（行号上没有标识符可解析），让给下面的跳定义逻辑。
    const ln = e.target.closest('.ln');
    if (ln && ln.dataset.lnJump && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      openSourceFile({ line: Number(ln.dataset.lnJump), worktree: e.altKey });
      return;
    }
    const code = e.target.closest('.code');
    const line = e.target.closest('.hl');
    if (!code || !line) return;
    if (!(e.ctrlKey || e.metaKey || e.altKey)) return;
    e.preventDefault();
    requestGoToSymbol(e.altKey ? 'reference' : 'definition', line, code, e.clientX, e.clientY);
  });

  // 左列表：单击=选中并展开；再点同一文件=折叠
  $('#list').addEventListener('click', (e) => {
    const row = e.target.closest('.frow');
    if (!row) return;
    const i = Number(row.dataset.idx);
    if (i === S.idx) { S.open = !S.open; renderList(); renderDiff(); renderHeader(); return; }
    S.idx = i;
    S.open = true;
    S.hunkIdx = 0;
    renderList();
    renderDiff();
    renderHeader();
  });

  function showStatus(text, kind) {
    const st = $('#status');
    if (!text) { st.className = 'hidden'; st.textContent = ''; return; }
    st.className = kind === 'error' ? 'error' : kind === 'ok' ? 'ok' : '';
    st.textContent = text;
  }

  let toastTimer = null;
  function toast(text) {
    const t = $('#toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  renderHeader();
  renderList();
  renderDiff();
  applyZoom();   // 先把缩放/列表恢复成默认值，等 uiState 回来再覆盖
  applyList();
  applySbs();
  applySym();
  applyTheme();        // 先把 diff 区配色定下来（auto = 跟编辑器主题走），再等 uiState 覆盖
  watchEditorTheme();  // 编辑器换主题时跟着换
  let resizeListTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeListTimer);
    resizeListTimer = setTimeout(applyListWidth, 100);
  });
})();
</script>
</body>
</html>
