<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pretty Commit</title>
<style>
  :root {
    --bg: var(--vscode-editor-background, #1e1e1e);
    --fg: var(--vscode-editor-foreground, #d4d4d4);
    --dim: var(--vscode-descriptionForeground, #9d9d9d);
    --border: var(--vscode-panel-border, #2b2b2b);
    --add-bg: rgba(46, 160, 67, 0.16);
    --del-bg: rgba(248, 81, 73, 0.15);
    --hh-bg: rgba(0, 127, 255, 0.12);
    --hh-fg: var(--vscode-textLink-foreground, #4daafc);
    --chg: #4daafc;
    --hx-bg: rgba(77, 170, 252, 0.14);
    --hx-bg-hover: rgba(77, 170, 252, 0.26);
    --mono: var(--vscode-editor-font-family, ui-monospace, Menlo, Consolas, monospace);
    --sel: var(--vscode-list-activeSelectionBackground, #04395e);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--vscode-font-family, system-ui, sans-serif);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* ---- 顶栏 ---- */
  header.bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--vscode-editorWidget-background, #252526);
    flex: 0 0 auto;
  }
  .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  #commit-meta { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #commit-sub { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .ctrl { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  /* 顶栏里的分组分隔线（改动导航 / AI 分析是两件事） */
  .ctrl .sep { width: 1px; align-self: stretch; margin: 0 2px; background: var(--border); }
  /* 顶栏符号按钮（≡ / ↑↓ / P N / ±）：无边框，字号加大，和文字按钮区分开 */
  .ctrl button.icon,
  .ctrl button.icon.tool {
    padding: 2px 6px;
    font-family: var(--mono);
    line-height: 1;
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--vscode-foreground, #e8e8e8);
  }
  .ctrl button.icon.tool {
    font-size: 19px;
    font-weight: 700;
    min-width: 28px;
  }
  .ctrl button.icon.tool.file {
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .ctrl button.icon:hover:not(:disabled),
  .ctrl button.icon.tool:hover:not(:disabled) {
    background: rgba(127, 127, 127, 0.22);
    color: var(--vscode-focusBorder, #007fd4);
  }
  .ctrl button.icon:disabled,
  .ctrl button.icon.tool:disabled { opacity: 0.32; }
  .nav-tools {
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .nav-tools .nav-gap {
    width: 10px;
    flex: 0 0 10px;
  }
  label.switch { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  button {
    background: var(--vscode-button-secondaryBackground, #3a3d41);
    color: var(--vscode-button-secondaryForeground, #ddd);
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover:not(:disabled) { background: var(--vscode-button-secondaryHoverBackground, #45494e); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary {
    background: var(--vscode-button-background, #0e639c);
    color: var(--vscode-button-foreground, #fff);
  }
  button.primary:hover:not(:disabled) { background: var(--vscode-button-hoverBackground, #1177bb); }
  kbd {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0 3px;
    background: rgba(127,127,127,.08);
  }
  /* ---- 状态条 ---- */
  /* ---- 页签：并排打开的多笔 diff，互不覆盖 ---- */
  #tabs {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    gap: 1px;
    padding: 0 6px;
    background: var(--vscode-editorWidget-background, #252526);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
  }
  .tab {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    max-width: 340px;
    padding: 4px 4px 4px 10px;
    font-size: 12px;
    color: var(--dim);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .tab:hover { background: rgba(127,127,127,.12); }
  .tab.active { color: var(--fg); border-bottom-color: var(--vscode-focusBorder, #007fd4); }
  .tab .t-sha { font-family: var(--mono); font-size: 11px; flex: 0 0 auto; }
  .tab .t-sub { overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .tab .t-x {
    flex: 0 0 auto;
    border: none;
    background: transparent;
    color: inherit;
    font-size: 13px;
    line-height: 1;
    padding: 0 3px;
    border-radius: 3px;
    cursor: pointer;
    opacity: .65;
  }
  .tab .t-x:hover { background: rgba(127,127,127,.3); opacity: 1; }
  /* 顶栏里被「打开」的开关（双页对比等） */
  .ctrl button.icon.tool.on {
    color: var(--vscode-focusBorder, #007fd4);
    background: rgba(0, 127, 212, .18);
  }
  #status {
    flex: 0 0 auto;
    padding: 3px 10px;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
    color: var(--dim);
    background: rgba(127,127,127,.06);
  }
  #status.error { color: var(--vscode-errorForeground, #f48771); }
  #status.hidden { display: none; }
  #status.ok { color: var(--vscode-charts-green, #89d185); }
  #toast {
    position: fixed;
    right: 12px;
    bottom: 12px;
    max-width: 60%;
    background: var(--vscode-notifications-background, #333);
    color: var(--vscode-notifications-foreground, #ddd);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 12px;
    opacity: 0;
    transition: opacity .15s;
    z-index: 50;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  /* ---- 主体：左列表 + 右 diff ---- */
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    /* 默认窄一些，把宽度让给 diff；宽度由拖动手柄改 flex-basis，不靠 CSS resize
       （Webview 里 resize:horizontal 经常没有手柄、拖不动）。 */
    flex: 0 0 260px;
    min-width: 140px;
    max-width: 46%;
    overflow-x: hidden;
    overflow-y: auto;
  }
  /* 左右分栏拖动手柄：5px 宽，hover / 拖动时高亮 */
  .split {
    flex: 0 0 5px;
    cursor: col-resize;
    background: var(--vscode-panel-border, #2b2b2b);
    position: relative;
    z-index: 3;
  }
  .split:hover, body.dragging-split .split {
    background: var(--vscode-focusBorder, #007fd4);
  }
  body.dragging-split { cursor: col-resize; user-select: none; }
  /* 收起文件列表：diff 独占整个宽度 */
  body.list-collapsed aside,
  body.list-collapsed .split { display: none; }
  #list { display: flex; flex-direction: column; }
  .frow {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .frow:hover { background: rgba(127,127,127,.1); }
  .frow.active { background: var(--sel); color: var(--vscode-list-activeSelectionForeground, #fff); }
  .fpath {
    overflow: hidden;
    text-overflow: ellipsis;
    direction: rtl; /* 长路径优先露出文件名尾段 */
    text-align: left;
    font-family: var(--mono);
    font-size: 12px;
  }
  .fstats { margin-left: auto; font-size: 11px; font-family: var(--mono); flex: 0 0 auto; }
  .add-c { color: var(--vscode-charts-green, #89d185); }
  .del-c { color: var(--vscode-charts-red, #f14c4c); }
  .glyph { font-family: var(--mono); font-size: 11px; flex: 0 0 auto; }
  #listEmpty { padding: 10px; color: var(--dim); }
  /* ---- 右 diff 区 ---- */
  /* 结构性样式（与配色无关）。背景/文字色必须在这里显式取 --bg/--fg：
     body 上的 color 是按 VS Code 主题算好的，只改 section 里的变量不会改变它继承到的 color。 */
  section {
    flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--bg);
    color: var(--fg);
  }

  /* ---- 配色 ----
     两套主题。**底色/正文/注释基线取自 Gerrit 官方**，语法 token 用的是另一套更克制的配色
     （见每行注释）。Gerrit 的「background / highlight」正好对应这套布局的两个位置：
       整行底色（符号列 + 代码）= background；不再有第二条「highlight」色带（见下）。
     谁的变量生效由 body 上的 pc-light / pc-dark 决定（见 applyTheme()）—— 切主题只换类，
     不重绘 diff。
     这里**只管「跟主题走」的颜色**；色带（增删行的绿/红及其前景色）是另一个轴，写在下面的
     .i-subtle / .i-standard / .i-strong 三块里，两轴独立组合（3 × 2 = 6 种）。 */
  body.pc-light section {
    --bg: #ffffff;             /* Background */
    --fg: #202124;             /* Text */
    --dim: #5f6368;            /* 次级文字：Gerrit 未定义，取同族 Google Grey 700 */
    --border: #dadce0;
    /* 色带 + 落在色带上的符号/注释（共 5 个变量）都在下面的
       .i-subtle / .i-standard / .i-strong 三块里 —— 它们随「深浅」变，不随主题变。
       行号列不染，它跟上下文行走同一套中性色。 */
    --hh-bg: #f1f3f4;          /* hunk 头（Gerrit 未定义，同族浅灰） */
    --hh-fg: #5f6368;
    --lnx: #dadce0;            /* 行号列分隔线 */
    --ln-fg: #5f6368;
    --gutter-bg: #f8f9fa;      /* 上下文行的行号列：比正文略暗，把 gutter 和代码分层 */
    --chg: #1967d2;            /* 当前改动点：Gerrit Type 蓝 */
    --hx-bg: rgba(25, 103, 210, 0.10);
    --hx-bg-hover: rgba(25, 103, 210, 0.20);
    --flash-bg: #ffec8b;       /* 跳到改动点闪高 */
    --cmt: #6e7781;            /* Comment（正文/白底行）*/
    /* 语法 token：柔和配色（不是 Gerrit 那套高饱和的 CodeMirror 色 —— 那套铺在绿/红
       色带上会和底色打架）。只留四个色相，都在「绿/红底上都不打架」的安全范围内。 */
    --tok-kw: #0550ae;         /* 关键字（if/for/while/return）*/
    --tok-type: #953800;       /* 内置类型与宏：int/uint32_t/RCC_CR_* */
    --tok-num: #0550ae;        /* 数字常量 */
    --tok-str: #0a3069;        /* 字符串 */
    --tok-fn: #8250df;         /* 函数名 / 调用 */
    --tok-mem: #24292f;        /* 成员访问，跟随正文 */
    --tok-pre: #6e7781;        /* 预处理指令 #include… */
    --tok-esc: #0a3069;        /* 转义序列（在字符串里，与字符串同色）*/
  }
  body.pc-dark section {
    --bg: #202124;             /* Background */
    --fg: #e8eaed;             /* Text */
    --dim: #9aa0a6;
    --border: #3c4043;
    /* 色带 + 落在色带上的符号/注释（共 5 个变量）都在下面的
       .i-subtle / .i-standard / .i-strong 三块里 —— 它们随「深浅」变，不随主题变。
       行号列不染，它跟上下文行走同一套中性色。 */
    --hh-bg: #2e3135;
    --hh-fg: #9aa0a6;
    --lnx: #3c4043;
    --ln-fg: #9aa0a6;
    --gutter-bg: #292a2d;
    --chg: #75a5ff;            /* 当前改动点：Gerrit Dark Function title 蓝 */
    --hx-bg: rgba(117, 165, 255, 0.14);
    --hx-bg-hover: rgba(117, 165, 255, 0.26);
    --flash-bg: #6b5a1e;
    --cmt: #8b949e;            /* Comment（正文/白底行）*/
    /* 语法 token：柔和配色（同浅色那套的深色版）*/
    --tok-kw: #ff7b72;         /* 关键字 */
    --tok-type: #ffa657;       /* 内置类型与宏 */
    --tok-num: #79c0ff;        /* 数字常量 */
    --tok-str: #a5d6ff;        /* 字符串 */
    --tok-fn: #d2a8ff;         /* 函数名 / 调用 */
    --tok-mem: #c9d1d9;        /* 成员访问 */
    --tok-pre: #8b949e;        /* 预处理指令 */
    --tok-esc: #a5d6ff;        /* 转义序列 */
  }
  /* ---- 色带深浅：淡 / 标准 / 浓 ----
     Gerrit 官方给的「ADD background」是 Material 的 50 号色（浅色 #D8FED8、深色 #2C553A），
     铺满整行时太淡 —— 实测它和白底的对比只有 1.10 / 1.14，几乎看不出色带。所以官方那档只当
     「淡」，默认用「标准」。三档的色相都钉在 Gerrit 原值上（浅色绿 120°、红 353°；
     深色绿 140°、红 1°），只动亮度，所以换档不会变成另一种绿/红。

     **红绿必须等重**：官方那对在浅色里是 1.10 / 1.14（几乎相等），但在深色里是 1.89 / 1.23 ——
     红色明显偏轻。加深时如果按「各自的对比度」去调，很容易把红压得比绿重得多（试过一版是
     1.32 / 2.11），看起来就是红行一片荧光、绿行正常，整体很脏。所以「标准」和「浓」都按
     **绿行与红行的亮度相等**来解（`--add-bg` 与 `--del-bg` 的亮度差 < 0.005），这才是真正的等重。

     每个档位块管 5 个变量，分两类：
       ① 色带（--add-bg / --del-bg）：整行底色 —— **从符号列一直到代码末尾都是它**。
          符号列的底色是 `background: inherit` 继承过来的，所以两者天然一致，
          不会在 +/- 号那里出现第二条更深/更亮的色带。
          **行号列不染**：行号始终用中性的 --gutter-bg / --ln-fg，和上下文行一样 ——
          数字那一带保持干净的灰底。
       ② 落在色带上的前景色：--add-mark / --del-mark（+ / − 符号）、--cmt-on-tint（注释）。
     ② 这一组必须跟着档位走，否则会糊：同一色系里前景和背景不能同时变深 ——
     色带越深，符号和注释就得往反方向走。所以加深色带就必然要重配这批前景色。

     深浅和主题是两个独立的轴（3 × 2 = 6 种组合），所以档位块写成 body.pc-<主题>.i-<深浅>；
     主题块只管「跟主题走」的那些色（背景、正文、token、上下文行 gutter…），不碰色带。

     数值不是随手挑的，是按这几条硬约束解出来的（assets/pc-lineno-test.js 会把 6 种组合逐个复算）：
       · 色带上的正文对比 ≥ 4.5 —— 这是加深的上限。深色主题先撞上它：再亮下去正文就糊。
       · 色带上的 +− 符号 ≥ 4.5 —— 字号最小，最不能糊。
       · 色带上的注释：浅色 ≥ 4.0、深色 ≥ 3.1。
       · 加深的两档红绿亮度差 < 0.005；三档的「存在感」逐档上升，色相不许跑偏。 */
  body.pc-light.i-subtle section {
    --add-bg:        #d8fed8;   /* 色带：整行底色 */
    --del-bg:        #ffebee;   /* 色带：整行底色 */
    --add-mark:      #166534;   /* 色带上的 + 号 */
    --del-mark:      #a40e26;   /* 色带上的 − 号 */
    --cmt-on-tint:   #606871;   /* 色带上的注释 */
  }
  body.pc-light.i-standard section {
    --add-bg:        #adf5af;   /* 色带：整行底色 */
    --del-bg:        #f9d5db;   /* 色带：整行底色 */
    --add-mark:      #166534;   /* 色带上的 + 号 */
    --del-mark:      #a40e26;   /* 色带上的 − 号 */
    --cmt-on-tint:   #596069;   /* 色带上的注释 */
  }
  body.pc-light.i-strong section {
    --add-bg:        #90f295;   /* 色带：整行底色 */
    --del-bg:        #f8c9d0;   /* 色带：整行底色 */
    --add-mark:      #166534;   /* 色带上的 + 号 */
    --del-mark:      #a40e26;   /* 色带上的 − 号 */
    --cmt-on-tint:   #535a62;   /* 色带上的注释 */
  }
  body.pc-dark.i-subtle section {
    --add-bg:        #2c553a;   /* 色带：整行底色 */
    --del-bg:        #62110f;   /* 色带：整行底色 */
    --add-mark:      #8ff0b0;   /* 色带上的 + 号 */
    --del-mark:      #ff9b94;   /* 色带上的 − 号 */
    --cmt-on-tint:   #aab1b8;   /* 色带上的注释 */
  }
  body.pc-dark.i-standard section {
    --add-bg:        #25623c;   /* 色带：整行底色 */
    --del-bg:        #97211e;   /* 色带：整行底色 */
    --add-mark:      #a7f3c1;   /* 色带上的 + 号 */
    --del-mark:      #ffcdc9;   /* 色带上的 − 号 */
    --cmt-on-tint:   #b8bec4;   /* 色带上的注释 */
  }
  body.pc-dark.i-strong section {
    --add-bg:        #256e42;   /* 色带：整行底色 */
    --del-bg:        #ab1d1c;   /* 色带：整行底色 */
    --add-mark:      #d7fae2;   /* 色带上的 + 号 */
    --del-mark:      #ffdbd9;   /* 色带上的 − 号 */
    --cmt-on-tint:   #c7ccd1;   /* 色带上的注释 */
  }
  /* 这两个类在深色壳（左列表）和白底（diff 头）里都用，所以只在 section 内换深色版 */
  section .add-c { color: var(--add-mark); }
  section .del-c { color: var(--del-mark); }
  #diffhead {
    flex: 0 0 auto;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: baseline;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #diffnote { flex: 0 0 auto; padding: 4px 10px; font-size: 11px; color: var(--dim); }
  /* diff 头里的路径：占满剩余宽度、过长省略，别把右边的按钮挤出可视区 */
  #diffhead .dpath { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* diff 头右侧的「跳到原文」按钮 */
  #diffhead button.jump {
    margin-left: auto;
    flex: 0 0 auto;
    font-size: 11px;
    padding: 1px 8px;
    align-self: center;
  }
  #placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font-size: 13px;
    text-align: center;
    padding: 20px;
    white-space: pre-line;
  }
  #diffbody {
    flex: 1;
    position: relative;
    overflow-y: auto;
    overflow-x: auto;
    font-family: var(--diff-font, var(--mono));
    font-weight: var(--diff-weight, 500);
    font-size: 13px;
    line-height: 1.5;
    padding: 4px 0;
    tab-size: 4;               /* 制表符按 4 走；默认 8 在缩进深的代码里很散 */
    /* 两列行号的宽度：按本文件最大行号位数算，renderDiff 里设 --ln-digits。
       数字本身是 1ch，加上左右各 4px 内边距再留一点余量 —— 行号列要尽量窄，
       宽度留给代码。 */
    --sign-w: 14px;
    /* 行号单独缩小字号，列宽按 digit 数收紧 */
    --ln-w: calc(var(--ln-digits, 3) * 7px + 4px);
  }
  /* 一行 = 旧行号 | 新行号 | 符号 | 正文。
     行号列用略暗的灰底（--gutter-bg），和正文分成两层，**任何行都是这个底** ——
     add/del 行的行号列不染，色带从符号列开始，而且符号列与代码区同色（一条均匀色带）。
     .hl 自己也要给不透明底色：行号列和符号列都是 sticky 的，横向滚动时正文要从它们底下滑过去。 */
  .hl {
    display: flex;
    width: max-content;        /* 长行照旧横向滚动 */
    min-width: 100%;
    min-height: 1.5em;
    background: var(--bg);
    white-space: pre;
    user-select: text;
  }
  .hl.ctx { color: var(--fg); }
  /* 增删行：整行就是 Gerrit 的 background 色，**平涂**。
     这里刻意不用 linear-gradient：一行一个 div、连续多行各自画一次渐变，接缝处会看出
     一条条横纹（像百叶窗），越长的改动块越明显。精致感交给 +/- 符号和语法着色，不交给渐变。
     用 :where(:not(.sbs)) 而不是 :not(.sbs)：:where 不贡献优先级，
     否则这条 (0,3,0) 会盖过后面的 .hl.flash（跳到改动点时的闪高）。 */
  .hl.add:where(:not(.sbs)) { background: var(--add-bg); }
  .hl.del:where(:not(.sbs)) { background: var(--del-bg); }
  .hl.nonl { color: var(--dim); }        /* "\ No newline at end of file" */
  .ln {
    flex: 0 0 var(--ln-w);
    padding: 0 2px 0 3px;
    text-align: right;
    color: var(--ln-fg);
    background: var(--gutter-bg);
    position: sticky;          /* 横向滚动时钉在左侧 */
    user-select: none;         /* 拖选代码时别把行号带进选区 */
    font-size: 10.5px;
    line-height: 1.5em;
    font-weight: 400;
  }
  /* add/del 行的符号列：**和代码区一个底色**（inherit 整行的色带），不另外加深/提亮。
     整行从符号列到代码末尾是一条均匀色带，分隔靠 +/- 符号本身的颜色，不靠第二条色带。
     符号列 sticky，必须不透明；底色 inherit 自 .hl（或双页的 .side），本身就是不透明的。
     右侧那条 1px 分隔线也一并透明掉，否则色带上会多出一条灰色细线。 */
  .hl.add .sign, .hl.del .sign { background: inherit; border-right-color: transparent; }
  .ln-old { left: 0; border-right: 1px solid var(--lnx); }
  .ln-new { left: var(--ln-w); border-right: 1px solid var(--lnx); }
  /* 行号就是「跳到原文这一行」的把手：行号本来就 user-select:none，
     拿它当点击热区不会和拖选代码打架（点代码区仍然是选文字）。
     只有真的有对应行号的行才可点 —— 见 makeLine/makeSbsCell 里的 data-ln-jump。 */
  .ln[data-ln-jump] { cursor: pointer; }
  .ln[data-ln-jump]:hover {
    color: var(--fg);
    text-decoration: underline;
    background: var(--lnx);
  }
  /* +/- 单独一列：与代码区 visual 分隔，且不可选中（复制代码不会带上前缀） */
  .sign {
    flex: 0 0 var(--sign-w);
    width: var(--sign-w);
    text-align: center;
    user-select: none;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.5em;
    color: var(--ln-fg);
    background: var(--gutter-bg);
    position: sticky;
    left: calc(var(--ln-w) * 2);
    border-right: 1px solid var(--lnx);
  }
  /* 符号用 highlight 色系里更实的那一笔 */
  .sign.add-mark { color: var(--add-mark); font-weight: 700; }
  .sign.del-mark { color: var(--del-mark); font-weight: 700; }
  .code {
    flex: 0 0 auto;
    padding: 0 10px 0 8px;
    cursor: text;
    user-select: text;
  }
  .cmt { color: var(--cmt); font-style: italic; font-weight: 400; }
  /* 有色行上的注释单独给色：Gerrit 的 #3F7F5F 是中间调，铺在加深过的色带上会糊（≤2.3:1）。
     白底行不动，仍然用 Gerrit 原值；只在增删行上换成能压住色带的版本，颜色随深浅三档走。 */
  .hl.add .cmt, .hl.del .cmt,
  .hl.sbs .side.add .cmt, .hl.sbs .side.del .cmt { color: var(--cmt-on-tint); }
  /* ---- 语法着色：只给需要区分的 token 套 span，其余走纯文本节点（省 CPU） ---- */
  .tk-kw { color: var(--tok-kw); }
  .tk-type { color: var(--tok-type); }
  .tk-num { color: var(--tok-num); }
  .tk-str { color: var(--tok-str); }
  .tk-fn { color: var(--tok-fn); }
  .tk-mem { color: var(--tok-mem); }
  .tk-pre { color: var(--tok-pre); }
  .tk-esc { color: var(--tok-esc); }
  /* 当前改动点：代码区左边一条蓝色标记（inset shadow 不占布局，文字不会位移） */
  .hl.chg .code { box-shadow: inset 4px 0 0 0 var(--chg); }
  /* 刚跳过来时整块闪一下，位置好找；放在 .add/.del 之后才能盖住它们的底色 */
  .hl.flash { background: var(--flash-bg); box-shadow: none; }
  .hl.flash .ln, .hl.flash .sign, .hl.flash .code { background: inherit; }
  .hh {
    background: var(--hh-bg);
    color: var(--hh-fg);
    font-weight: 600;
    /* 左边距跨过两列行号，让 @@ 与代码列对齐 */
    padding: 2px 10px 2px calc(var(--ln-w, 48px) * 2 + var(--sign-w, 14px) + 6px);
    margin-top: 2px;
    cursor: pointer;
  }
  .hh.cur { outline: 1px solid var(--hh-fg); }
  /* hunk 缝：要跟 @@ 头、普通上下文都分得开。用改动点那支蓝当强调色。 */
  .hx {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 0;
    line-height: 1.6;
    margin: 2px 8px;
    padding: 1px 8px;
    font-size: 11px;
    cursor: pointer;
    user-select: none;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--chg);
    background: var(--hx-bg);
    border: 1px dashed var(--chg);
    border-radius: 3px;
  }
  .hx:hover { background: var(--hx-bg-hover); }
  .hx.hx-open {
    /* 展开后条还在，才能点回去；稍微收一点，别压过源码 */
    font-weight: 500;
    border-style: solid;
    opacity: 0.92;
  }
  .hx .hx-ico { font-size: 10px; line-height: 1; }
  .hx .hx-n { font-weight: 700; font-variant-numeric: tabular-nums; }
  #diffhead button.hx-btn {
    color: var(--chg);
    border: 1px solid var(--chg);
    font-weight: 600;
  }
  /* ---- 双页对比（左旧右新）----
     一行仍然是一个 .hl，里面左右两个 .side；这样改动块导航 / 选区 / 送 Chat
     这些按行工作的逻辑一行都不用改。两侧各占 50%，长行走折行（不裁切，信息不丢）。 */
  #diffbody.sbs-mode { overflow-x: hidden; }
  .hl.sbs { width: 100%; min-width: 0; display: flex; align-items: stretch; }
  .hl.sbs .side {
    flex: 1 1 50%;
    min-width: 0;
    display: flex;
    align-items: flex-start;
    background: var(--bg);
    border-left: 1px solid var(--lnx);
  }
  .hl.sbs .side.left { border-left: none; }
  .hl.sbs .side.del { background: var(--del-bg); }
  .hl.sbs .side.add { background: var(--add-bg); }
  /* 对侧没有对应行：铺一块中性空底，一眼看出这里是纯增 / 纯删 */
  .hl.sbs .side.empty { background: var(--gutter-bg); }
  .hl.sbs .side.del .sign, .hl.sbs .side.add .sign { background: inherit; border-right-color: transparent; }
  .hl.sbs .side.empty .ln, .hl.sbs .side.empty .sign { background: var(--gutter-bg); }
  /* 单页里的行号是 sticky（横向滚动时钉住）；双页没有横向滚动，取消掉更省事 */
  .hl.sbs .ln, .hl.sbs .sign { position: static; }
  .hl.sbs .code {
    flex: 1 1 auto;
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  /* 双页里 hunk 头只需跨过「一列行号 + 一列 sign」；长 hunk 头折行，别被裁掉 */
  #diffbody.sbs-mode .hh {
    padding-left: calc(var(--ln-w, 48px) + var(--sign-w, 14px) + 6px);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  /* 双页里整行底色被两个 .side 盖住了，闪高得画到 .side 上才看得见 */
  .hl.sbs.flash .side,
  .hl.sbs.flash .side.add,
  .hl.sbs.flash .side.del,
  .hl.sbs.flash .side.empty,
  .hl.sbs.flash .side .ln,
  .hl.sbs.flash .side .sign,
  .hl.sbs.flash .ln,
  .hl.sbs.flash .sign { background: var(--flash-bg); }

  .note { padding: 3px 10px; color: var(--dim); font-size: 11px; }
  .notrunc { border-top: 1px dashed var(--border); }
  /* 选中有内容时浮出的「添加到 Chat」按钮（Ctrl+L 的鼠标等价物） */
  #sel-add {
    position: fixed;
    right: 18px;
    bottom: 44px;
    z-index: 60;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  #sel-add.show { display: inline-block; }
  #sel-add.hot {
    background: var(--vscode-button-background, #0e639c);
    color: var(--vscode-button-foreground, #fff);
  }
  /* ---- 底栏 ---- */
  footer {
    flex: 0 0 auto;
    padding: 3px 10px;
    border-top: 1px solid var(--border);
    color: var(--dim);
    font-size: 11px;
    display: flex;
    gap: 4px 12px;
    align-items: center;
    /* 允许折行：宁可多占一行，也不要把提示/控件裁掉（之前 nowrap+hidden 会直接切掉右半截） */
    flex-wrap: wrap;
    background: var(--vscode-editorWidget-background, #252526);
  }
  /* 顶栏里的缩放控件 */
  .zoom { display: inline-flex; align-items: center; gap: 2px; }
  .zoom button {
    padding: 2px 6px; font-size: 18px; font-weight: 700; line-height: 1;
    background: transparent; color: var(--vscode-foreground, #e8e8e8); border: none;
  }
  .zoom button:hover:not(:disabled) {
    color: var(--vscode-focusBorder, #007fd4);
    background: rgba(127, 127, 127, 0.22);
  }
  .zoom #zoom-info {
    min-width: 40px; text-align: center; font-family: var(--mono); font-size: 11px;
    cursor: pointer; color: var(--dim);
  }
  .zoom #zoom-info:hover { color: var(--fg); }
  ::selection { background: rgba(0,127,255,.35); }
  /* 白底上的选区不能再用深蓝，会盖住整行 */
  section ::selection { background: rgba(0,101,255,.20); }
  /* 通用隐藏：此前只有 #status.hidden 命中，导致 #placeholder / #diffbody 等
     切换 class="hidden" 时并没有真的隐藏，空占位块还占着高度 */
  .hidden { display: none !important; }
  /* 宿主版本诊断条：宿主 JS 是旧版（改了 extension.js 没 Reload Window）时出现。
     panel.html 每次开面板都从磁盘现读，所以只有这里能发现“改了没生效”。 */
  #diag {
    padding: 7px 14px; font-size: 12px; line-height: 1.5;
    background: rgba(255,180,0,.14); border-bottom: 1px solid rgba(255,180,0,.45);
    color: var(--fg);
  }
  #diag b { color: #ffb400; }
  #diag code { background: rgba(127,127,127,.22); padding: 0 4px; border-radius: 3px; }
  #diag button {
    margin-left: 8px; font-size: 11px; padding: 2px 8px; cursor: pointer;
    background: rgba(255,180,0,.22); border: 1px solid rgba(255,180,0,.55);
    color: var(--fg); border-radius: 4px;
  }
</style>

<!-- 主题先行：必须在第一次绘制之前把 pc-light / pc-dark 挂到 body 上，否则深色主题下会先闪一下
     白底的 diff 区。这段是「读 VS Code 注入的 --vscode-editor-background 算亮度」的**唯一**实现，
     后面 applyTheme() 复用它（pcEditorIsDark），所以不存在两套判断逻辑。 -->
<script>
function pcEditorIsDark() {
  try {
    var raw = getComputedStyle(document.body).getPropertyValue('--vscode-editor-background').trim();
    var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(raw);
    var rgb = null;
    if (m) {
      var h = m[1];
      if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
      rgb = h.match(/../g).map(function (x) { return parseInt(x, 16); });
    } else {
      var r = /rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/.exec(raw);
      if (r) rgb = [Number(r[1]), Number(r[2]), Number(r[3])];
    }
    if (!rgb) return false; // 读不到就按浅色（Gerrit 浅色是默认观感）
    var lin = rgb.map(function (v) {
      var x = v / 255;
      return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2] < 0.5;
  } catch (e) {
    return false;
  }
}
document.body.classList.add(pcEditorIsDark() ? 'pc-dark' : 'pc-light');
// 色带深浅也要在首绘前定下来（默认「标准」；宿主送来的 uiState 里若存过别的档，稍后 applyTheme 会换）。
// 不挂这个类的话首帧的行底色是空的，会闪一下没有色带的 diff。
document.body.classList.add('i-standard');
</script>

<script>
(function () {
  'use strict';
  const vscode = acquireVsCodeApi();

  // 页面里任何未捕获异常都上报给宿主（显示成错误消息，方便定位“白屏”）
  window.addEventListener('error', (ev) => {
    try {
      vscode.postMessage({ type: 'ext-error', text: String(ev.message || ev.error || 'unknown') });
    } catch { /* 忽略 */ }
  });
  window.addEventListener('unhandledrejection', (ev) => {
    try {
      vscode.postMessage({ type: 'ext-error', text: 'Promise: ' + String(ev.reason && ev.reason.message || ev.reason || 'unknown') });
    } catch { /* 忽略 */ }
  });

  // 就绪握手：宿主在收到本消息前会把发给我们的消息排队，不会丢首帧
  vscode.postMessage({ type: 'webview-ready' });

  const $ = (s) => document.querySelector(s);

  // ---------- 把自己的 OS 窗口抬到前台 ----------
  // 为什么要在这里做：面板「弹出为独立窗口」后，VS Code 会把 webview 渲染到那个新窗口里，
  // 但扩展宿主（跑 extension.js 的那个进程）仍然留在原窗口。宿主执行的所有命令
  // ——包括 workbench.action.chat.open——都作用在原窗口上，于是：
  //   · 弹窗刚出来时它在新窗口里，谁也不去激活它 → 看着像“在后台出来了”；
  //   · 送 Chat 后原窗口被带到前面 → 面板窗口被压到后面，像“隐藏了”。
  // 宿主没有任何 API 能聚焦别的 OS 窗口（vscode.window 里没有焦点相关的接口，
  // 工作台唯一的 focusWindow 是原生主进程服务，扩展拿不到）。
  // 唯一运行在「面板那个窗口」里的代码就是本页的 JS，所以只能靠下面这几句。
  function raiseWindow(why) {
    const focus1 = () => {
      try { window.focus(); } catch { /* 忽略 */ }
      try { if (window.parent && window.parent !== window) window.parent.focus(); } catch { /* 跨域允许 */ }
      try { if (window.top && window.top !== window) window.top.focus(); } catch { /* 跨域允许 */ }
    };
    focus1();
    // 独立窗口刚被创建时，第一发可能落在窗口还没完成激活的时间点上，补两发
    setTimeout(focus1, 250);
    setTimeout(focus1, 800);
    // 把「本页到底是不是可见/有焦点」一并回报：这是唯一能区分两种失败场景的证据 ——
    // visibilityState=hidden 说明面板被同一窗口里的别的标签页盖住了（要 reveal），
    // visible 但没焦点说明是另一个 OS 窗口被压在后面（要 window.focus()）。
    try {
      vscode.postMessage({
        type: 'raised',
        why: why || '',
        visibility: document.visibilityState,
        focused: document.hasFocus(),
      });
    } catch { /* 忽略 */ }
  }

  // 主动问宿主构建版本：宿主若不理（旧版 extension.js 不认识这条消息），
  // 说明运行的是旧代码 —— 这时页面上的新功能有一半是空的，必须提示重载。
  let hostBuildTimer = setTimeout(() => {
    if (!S.hostVersion) {
      S.staleHost = true;
      try { renderDiag(); } catch { /* 忽略 */ }
    }
  }, 800);
  vscode.postMessage({ type: 'hostBuild' });
  // 顺带取回上次的缩放档位和列表开关（旧宿主不认，静默无回应，用默认值）
  vscode.postMessage({ type: 'getUiState' });

  const STATUS_GLYPH = { A: '+', M: '~', D: '−', R: '»', T: '!' };
  const STATUS_NAME = { A: '新增', M: '修改', D: '删除', R: '重命名', T: '类型变更' };

  const S = {
    // ---- 多文档（页签）：打开的每一笔 diff 各自一份，互不覆盖 ----
    docs: [],        // [{ id, shortSha, subject, working, commit, view:{idx,open,hunkIdx,chgIdx,lastSel,scroll} }]
    activeId: null,  // 当前页签的 id（无页签时为 null）

    // ---- 下面是「当前页签」的实时视图状态（切页签时与 docs[i].view 互换）----
    files: [],
    idx: 0,
    open: true,      // 右侧是否展开
    hunkIdx: 0,      // 当前文件里的当前 hunk
    lastSel: null,   // 最近一次有效选区 {path, text}：点浮动按钮时选区会先收起，得留一份
    hiddenUnchanged: 0, // 宿主省略了多少个「无内容变化」文件
    hostVersion: '', // 宿主 JS 的构建标识（被 commit 消息带下来）
    staleHost: false, // 宿主没带 hostVersion → 运行的是旧版 extension.js
    delta: 0,
    shortSha: '',
    subject: '',
    note: '',
    busy: false,
    zoom: 0,          // 缩放档位（0 = 12px；正数放大）
    listOpen: true,   // 左侧文件列表是否展开
    listWidth: 220,   // 左侧文件列表宽度 px（拖动手柄改）
    colorComments: true,
    syntaxHighlight: true, // Gerrit 风格语法着色
    sideBySide: false,     // 双页对比（左旧右新）
    ignoreSymbols: true,   // 忽略「只差换行符/行尾空白」的改动（默认开；¶ 可切）
    symbolOnly: [],        // 因为上面这条而被 git 从 diff 里抹掉的文件名
    symbolsIgnored: true,  // 宿主实际用的是忽略模式（数据可能是旧的/宿主较老）
    diffTheme: 'auto',     // diff 配色：auto 跟随编辑器 / light / dark（Gerrit Light / Gerrit Dark）
    diffIntensity: 'standard', // 色带深浅：subtle（Gerrit 原色）/ standard / strong
    themeResolved: 'light',// auto 解析出来的实际主题（用于提示文案与自检）
    nativeTabs: false,     // 宿主把每个 diff 都开成了独立编辑器标签 → 页面不再画内部页签栏
    baseFontSize: 13, // 来自 prettyCommit.diffFontSize；± 缩放以此为基准
    diffForeground: null,
    diffBackground: null,
    chgIdx: -1,       // 当前改动点下标（-1 = 还没跳过；换文件时清掉）
    isWorking: false, // 工作区 diff：行号与磁盘文件一致；历史 commit 跳转可能对不齐
    changeBlocksCache: null, // renderDiff 后缓存改动块，避免 ↑↓ 反复扫 DOM
    chgMarkedEls: [],       // 当前高亮的改动行，markChange 只清这些而不 querySelectorAll
    blobs: {},              // `${docId}:${path}` → { newLines, oldLines }；展开 hunk 缝用
  };

  // ---------- 缩放 ----------
  // 只缩放 diff 区（行号列宽度用 1ch，会跟着字号一起变，所以 gutter 不会错位）。
  // 档位存进宿主的 globalState，下次 Alt+Q 打开还是这个大小。
  const ZOOM_STEP = 1.12;   // 每档 ×1.12
  const ZOOM_MIN = -3;
  const ZOOM_MAX = 10;

  function baseFontSizePx() {
    const b = Number(S.baseFontSize);
    return Number.isFinite(b) ? Math.max(8, Math.min(28, Math.round(b))) : 13;
  }

  function applyZoom() {
    const base = baseFontSizePx();
    const fs = Math.max(7, Math.round(base * Math.pow(ZOOM_STEP, S.zoom)));
    $('#diffbody').style.fontSize = fs + 'px';
    const zi = $('#zoom-info');
    if (zi) zi.textContent = Math.round((fs / base) * 100) + '%';
  }

  function applyDiffTheme() {
    const sec = document.querySelector('section');
    if (!sec) return;
    if (S.diffForeground) {
      sec.style.setProperty('--fg', S.diffForeground);
      sec.style.color = S.diffForeground;
    } else {
      sec.style.removeProperty('--fg');
      sec.style.removeProperty('color');
    }
    if (S.diffBackground) {
      sec.style.setProperty('--bg', S.diffBackground);
      sec.style.background = S.diffBackground;
    } else {
      sec.style.removeProperty('--bg');
      sec.style.removeProperty('background');
    }
  }

  function setZoom(delta) {
    const next = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, S.zoom + delta));
    if (next === S.zoom && delta !== 0) return;
    S.zoom = next;
    applyZoom();
    saveUi();
  }

  // ---------- 左侧文件列表 收起/展开 ----------
  function applyList() {
    document.body.classList.toggle('list-collapsed', !S.listOpen);
    const b = $('#btn-list');
    if (b) b.title = (S.listOpen ? '收起' : '展开') + '左侧文件列表（b）';
    applyListWidth();
  }

  function applyListWidth() {
    const aside = document.querySelector('aside');
    const main = document.querySelector('main');
    if (!aside || !main) return;
    const cap = Math.max(160, Math.floor(main.clientWidth * 0.46));
    const w = Math.max(140, Math.min(S.listWidth || 220, cap));
    S.listWidth = w;
    aside.style.flexBasis = w + 'px';
  }

  function toggleList() {
    S.listOpen = !S.listOpen;
    applyList();
    saveUi();
  }

  // ---------- 双页对比 ----------
  function applySbs() {
    const btn = $('#btn-sbs');
    if (btn) {
      btn.classList.toggle('on', !!S.sideBySide);
      btn.title = S.sideBySide ? '切回单页（s）' : '双页对比：左旧右新并排显示（s）';
    }
  }

  function toggleSideBySide() {
    S.sideBySide = !S.sideBySide;
    applySbs();
    saveUi();
    if (!S.files.length) { showStatus(S.sideBySide ? '已切到双页对比' : '已切回单页'); return; }
    // 重绘会清空 DOM 并把滚动条拉回顶部；按滚动比例还原，切模式时不会「跳回文件头」
    const body = $('#diffbody');
    const before = body.scrollHeight > body.clientHeight
      ? body.scrollTop / (body.scrollHeight - body.clientHeight) : 0;
    renderDiff();
    const after = $('#diffbody');
    if (after.scrollHeight > after.clientHeight) after.scrollTop = before * (after.scrollHeight - after.clientHeight);
    showStatus(S.sideBySide ? '双页对比：左旧 / 右新' : '单页视图');
  }

  // ---------- 符号差异（换行符 / 行尾空白）----------
  // 这个开关和「双页对比」不是一类东西：双页只改画法，本地重绘就够了；而它决定 git 用哪组
  // flag 算 diff（见 src/git.js 的 SYMBOL_IGNORE_FLAGS），所以切了必须让宿主重算数据。
  function applySym() {
    const btn = $('#btn-sym');
    if (!btn) return;
    btn.classList.toggle('on', !!S.ignoreSymbols);
    btn.title = S.ignoreSymbols
      ? '已忽略符号差异：换行符（CRLF/LF）、行尾空白、文件末尾换行 —— 只差这些的文件不会出现在列表里（¶ 显示它们）'
      : '正在显示符号差异：只差换行符/行尾空白的行也会标成红绿（¶ 忽略它们）';
  }

  function toggleIgnoreSymbols() {
    S.ignoreSymbols = !S.ignoreSymbols;
    applySym();
    saveUi();
    // 数据得重算，所以带上新值发一条；宿主会存进 globalState 再回 git 重跑。
    try { vscode.postMessage({ type: 'refreshDiff', ignoreSymbols: S.ignoreSymbols }); } catch { /* 忽略 */ }
    showStatus(S.ignoreSymbols ? '已忽略符号差异（换行符 / 行尾空白），正在重算…' : '正在显示符号差异，重算中…');
  }

  // ---------- diff 区配色：Gerrit Light / Gerrit Dark ----------
  // auto（默认）= 跟随编辑器主题。判断实现在 body 开头那段「主题先行」脚本里（pcEditorIsDark，
  // 必须在首次绘制前就把类挂上，否则深色主题会闪一下白底）：它读 VS Code 注入的
  // --vscode-editor-background 算亮度，比认 body 上的 vscode-dark 类可靠（后者是 webview 的实现细节）。
  function editorIsDark() {
    return typeof pcEditorIsDark === 'function' ? pcEditorIsDark() : false;
  }

  function resolvedTheme() {
    if (S.diffTheme === 'light' || S.diffTheme === 'dark') return S.diffTheme;
    return editorIsDark() ? 'dark' : 'light';
  }

  const THEME_GLYPH = { auto: '◐', light: '☀', dark: '☾' };
  const THEME_NAME = { auto: '跟随编辑器', light: '强制浅色', dark: '强制深色' };

  // 色带深浅三档。淡 = Gerrit 官方原值（那档铺满整行确实太淡），默认走标准。
  const DEPTH_ORDER = ['subtle', 'standard', 'strong'];
  const DEPTH_NAME = { subtle: '淡（Gerrit 原色）', standard: '标准', strong: '浓' };
  function normDepth(v) {
    return DEPTH_ORDER.indexOf(v) >= 0 ? v : 'standard';
  }

  // 只做幂等的 class 切换：值没变就不产生 DOM 变更，所以下面那个 MutationObserver
  // 不会因为自己改 class 而再次触发（不会自激）。
  function applyTheme() {
    const t = resolvedTheme();
    S.themeResolved = t;
    document.body.classList.toggle('pc-light', t === 'light');
    document.body.classList.toggle('pc-dark', t === 'dark');
    const depth = normDepth(S.diffIntensity);
    S.diffIntensity = depth;
    for (const d of DEPTH_ORDER) document.body.classList.toggle('i-' + d, d === depth);
    const btn = $('#btn-theme');
    if (btn) {
      btn.textContent = THEME_GLYPH[S.diffTheme] || THEME_GLYPH.auto;
      btn.classList.toggle('on', S.diffTheme !== 'auto' || depth !== 'standard');
      btn.title =
        `diff 配色：${THEME_NAME[S.diffTheme] || THEME_NAME.auto}` +
        `（当前 Gerrit ${t === 'dark' ? 'Dark' : 'Light'}，色带 ${DEPTH_NAME[depth]}）\n` +
        `点一下切 跟随 / 浅色 / 深色（t）；Shift+点击切 色带深浅 淡 / 标准 / 浓（d）`;
    }
  }

  function cycleDiffTheme() {
    const order = ['auto', 'light', 'dark'];
    S.diffTheme = order[(order.indexOf(S.diffTheme) + 1) % order.length];
    applyTheme();
    saveUi();
    showStatus(
      `diff 配色：${THEME_NAME[S.diffTheme]}` +
        (S.diffTheme === 'auto' ? `（Gerrit ${S.themeResolved === 'dark' ? 'Dark' : 'Light'}）` : '')
    );
  }

  // 色带深浅：纯 CSS 换 class，不用回 git 重算（和 ¶ 不一样）
  function cycleDiffDepth(step) {
    const cur = DEPTH_ORDER.indexOf(normDepth(S.diffIntensity));
    const dir = step === -1 ? -1 : 1;
    S.diffIntensity = DEPTH_ORDER[(cur + dir + DEPTH_ORDER.length) % DEPTH_ORDER.length];
    applyTheme();
    saveUi();
    showStatus(`色带深浅：${DEPTH_NAME[S.diffIntensity]}`);
  }

  // 编辑器换主题时自动跟着换（只在 auto 下有意义）。观察 html/body 的 class 与 style：
  // VS Code 换主题时会重写这两处。
  function watchEditorTheme() {
    if (typeof MutationObserver !== 'function') return;
    const obs = new MutationObserver(() => {
      if (S.diffTheme === 'auto') applyTheme();
    });
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style'] });
    obs.observe(document.body, { attributes: true, attributeFilter: ['class', 'style'] });
  }

  // ---------- 一键跳原文 ----------
  // 面板里看到的是 diff 片段，想改代码/看上下文得回到编辑器。这里把「当前文件 +
  // 目标行」交给宿主：
  //   工作区 diff → 打开磁盘上的真实文件（**可编辑**），光标落在对应行；
  //   历史 commit → 打开「该提交那一刻」的文件快照（只读），行号才对得上。
  // opts.line 指定行（点哪一行跳哪一行）；不传就退回「视口顶部那一行」（快捷键 o）。
  // opts.worktree = 历史 diff 下放弃快照、去开当前工作区里的同名文件（Alt+点击行号）。
  function topVisibleLine() {
    const body = $('#diffbody');
    if (!body) return null;
    const top = body.scrollTop + 8;
    for (const el of body.children) {
      if (!el.classList || !el.classList.contains('hl')) continue;
      if (el.offsetTop + el.offsetHeight < top) continue;
      const nw = parseInt(el.dataset.lnNew || '', 10);
      const od = parseInt(el.dataset.lnOld || '', 10);
      return Number.isFinite(nw) ? nw : (Number.isFinite(od) ? od : null);
    }
    return null;
  }

  // 把某一行滚到视口顶部（找不到精确的那一行就滚到最接近的位置）。
  // 为什么要按行而不是按像素还原滚动位置：重算后上面可能多了/少了几行、hunk 边界也可能变，
  // 同一个 scrollTop 会落到另一行上去 —— 那样「刷新」在体感上就是「页面自己跳了」。
  function scrollToLine(n) {
    if (!Number.isFinite(n) || n <= 0) return false;
    const body = $('#diffbody');
    if (!body) return false;
    let last = null;
    for (const el of body.children) {
      if (!el.classList || !el.classList.contains('hl')) continue;
      const j = parseInt(el.dataset.lnJump || '', 10);
      if (!Number.isFinite(j)) continue;
      if (j >= n) { body.scrollTop = el.offsetTop; return true; }
      last = el; // 目标行在文件末尾之后（内容变短了）→ 兜底滚到最后一行
    }
    if (last) { body.scrollTop = last.offsetTop; return true; }
    return false;
  }

  function openSourceFile(opts) {
    const o = opts || {};
    const f = curFile();
    if (!f) { toast('先选中一个文件'); return; }
    const line = Number.isFinite(o.line) && o.line > 0 ? o.line : topVisibleLine();
    vscode.postMessage({
      type: 'openSource',
      path: f.path,
      line,
      historical: !S.isWorking && !o.worktree,
      worktree: !!o.worktree,
    });
  }

  // ---------- 重读 diff（refresh）----------
  // 为什么要它：diff 是「某一刻」从 git 算出来的快照。文件在别处被改（编辑器存盘、
  // 终端里 git add / commit、外部工具改、切分支）之后，面板上显示的还是旧内容。
  // 宿主也会在保存 / git 索引变化时自动重算，这里是手动兜底。
  // 注意：重算不会重置你正在看的文件与滚动位置 —— 宿主下发新数据时，页面会先把
  // 当前位置 captureView 下来，再按「文件路径优先、下标兜底」还原（见 applyDoc）。
  function requestRefresh(all) {
    vscode.postMessage({ type: 'refresh', all: !!all });
    showStatus(all ? '正在重读全部 diff 标签…' : '正在重读 diff…');
  }

  // 左右分栏拖动手柄。不用 CSS resize：Chromium webview 里 aside 的拖拽角经常不出现。
  (function bindSplit() {
    const handle = $('#split');
    if (!handle) return;
    handle.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !S.listOpen) return;
      e.preventDefault();
      const aside = document.querySelector('aside');
      const main = document.querySelector('main');
      const startX = e.clientX;
      const startW = aside.getBoundingClientRect().width;
      document.body.classList.add('dragging-split');
      try { handle.setPointerCapture(e.pointerId); } catch { /* 忽略 */ }
      const move = (ev) => {
        const cap = Math.max(160, Math.floor(main.clientWidth * 0.46));
        S.listWidth = Math.max(140, Math.min(cap, Math.round(startW + (ev.clientX - startX))));
        applyListWidth();
      };
      const up = () => {
        document.body.classList.remove('dragging-split');
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        saveUi();
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  })();

  // ---------- 界面偏好落盘（缩放 / 列表开关） ----------
  // 交给宿主的 globalState 存。旧宿主不认这两条消息，静默失败即可 —— 页面用默认值照常跑。
  let uiSaveTimer = null;
  function saveUi() {
    clearTimeout(uiSaveTimer);
    uiSaveTimer = setTimeout(() => {
      try {
        vscode.postMessage({ type: 'saveUiState', ui: { zoom: S.zoom, listOpen: S.listOpen, listWidth: S.listWidth, sideBySide: S.sideBySide, ignoreSymbols: S.ignoreSymbols, diffTheme: S.diffTheme, diffIntensity: S.diffIntensity } });
      } catch { /* 忽略 */ }
    }, 400);
  }

  function applyUi(ui) {
    if (!ui || typeof ui !== 'object') return;
    if (Number.isFinite(Number(ui.zoom))) { S.zoom = Number(ui.zoom); applyZoom(); }
    if (typeof ui.listOpen === 'boolean') { S.listOpen = ui.listOpen; }
    if (Number.isFinite(Number(ui.listWidth))) S.listWidth = Math.round(Number(ui.listWidth));
    applyList();
    const body = $('#diffbody');
    if (typeof ui.fontFamily === 'string' && ui.fontFamily.trim() && body) {
      body.style.fontFamily = ui.fontFamily;
    }
    if (Number.isFinite(Number(ui.fontWeight)) && body) {
      body.style.fontWeight = String(ui.fontWeight);
    }
    if (Number.isFinite(Number(ui.baseFontSize))) {
      S.baseFontSize = Math.max(8, Math.min(28, Math.round(Number(ui.baseFontSize))));
      applyZoom();
    }
    const fgIn = ui.diffForeground;
    S.diffForeground = typeof fgIn === 'string' && fgIn.trim() ? fgIn.trim() : null;
    const bgIn = ui.diffBackground;
    S.diffBackground = typeof bgIn === 'string' && bgIn.trim() ? bgIn.trim() : null;
    applyDiffTheme();
    const nextCmt = ui.colorComments !== false;
    const cmtChanged = nextCmt !== S.colorComments;
    S.colorComments = nextCmt;
    const nextTk = ui.syntaxHighlight !== false;
    const tkChanged = nextTk !== S.syntaxHighlight;
    S.syntaxHighlight = nextTk;
    const nextSbs = ui.sideBySide === true;
    const sbsChanged = nextSbs !== S.sideBySide;
    S.sideBySide = nextSbs;
    applySbs();
    // 配色：纯 CSS，换 class 就行，不用回 git 重算（和 ¶ 不一样）
    const nextTheme = ui.diffTheme === 'light' || ui.diffTheme === 'dark' ? ui.diffTheme : 'auto';
    if (nextTheme !== S.diffTheme) {
      S.diffTheme = nextTheme;
      applyTheme();
    }
    // 色带深浅同理
    const nextDepth = ui.diffIntensity === 'subtle' || ui.diffIntensity === 'strong'
      ? ui.diffIntensity : 'standard';
    if (nextDepth !== S.diffIntensity) {
      S.diffIntensity = nextDepth;
      applyTheme();
    }
    // 符号差异开关：别的标签按了 ¶ 会通过 uiState 广播过来。这个开关改的是 git 的算法，
    // 所以这里不能只更新按钮 —— 得让宿主重算数据（自己按的时候已经在点击处发过了）。
    const nextSym = ui.ignoreSymbols !== false;
    const symChanged = nextSym !== S.ignoreSymbols;
    S.ignoreSymbols = nextSym;
    applySym();
    if (symChanged) {
      try { vscode.postMessage({ type: 'refreshDiff' }); } catch { /* 忽略 */ }
    }
    if ((cmtChanged || tkChanged || sbsChanged) && S.files.length) renderDiff();
  }

  // ---------- 消息 ----------
  window.addEventListener('message', (ev) => {
    const m = ev.data;
    if (!m || !m.type) return;
    switch (m.type) {
      case 'ping':
        vscode.postMessage({ type: 'pong', id: m.id });
        break;
      case 'commit':
        try {
          applyCommit(m.commit, m.hostVersion, m.docId, m.nativeTabs);
        } catch (e) {
          try {
            vscode.postMessage({ type: 'ext-error', text: 'applyCommit: ' + String(e && e.message || e) });
          } catch { /* 忽略 */ }
        }
        break;
      case 'tabs':
        // 宿主侧的页签清单变了（切页签 / 关页签的确认回执），以宿主为准对一次
        try {
          if (Array.isArray(m.tabs) && m.tabs.length) {
            const known = new Set(m.tabs.map((t) => t.id));
            S.docs = S.docs.filter((d) => known.has(d.id));
            for (const t of m.tabs) {
              let d = docOf(t.id);
              if (!d) { d = { id: t.id, view: {} }; S.docs.push(d); }
              d.shortSha = t.shortSha;
              d.subject = t.subject;
              d.working = !!t.working;
            }
            if (m.activeDocId) S.activeId = m.activeDocId;
          }
          renderTabs();
        } catch { /* 忽略 */ }
        break;
      case 'wantSelection': {
        // 宿主收到清单快捷键（Ctrl+L）后反过来问：现在选中的是什么
        const s = currentSelection();
        vscode.postMessage({ type: 'selection', path: s ? s.path : '', text: s ? s.text : '' });
        break;
      }
      case 'hostBuild': // 回应页面的版本询问
        clearTimeout(hostBuildTimer);
        S.hostVersion = m.hostVersion || '';
        S.staleHost = !S.hostVersion;
        {
          const hb = $('#host-build');
          if (hb) hb.textContent = S.hostVersion ? `宿主 ${S.hostVersion}` : '宿主 旧版(未重载)';
        }
        renderDiag();
        break;
      case 'uiState': // 回应 getUiState：恢复上次的缩放与列表开关
        applyUi(m.ui);
        break;
      case 'raise': // 宿主请求：把面板所在的 OS 窗口抬到前台
        raiseWindow(m.why);
        break;
      case 'status':
        showStatus(m.text, m.kind);
        break;
      case 'busy':
        S.busy = !!m.value;
        renderHeader();
        break;
      case 'toast':
        toast(m.text);
        break;
      case 'fileBlob':
        onFileBlob(m);
        break;
    }
  });

  // 宿主版本诊断条。出现 = 运行中的 extension.js 是旧版（改了 host 代码没 Reload Window）。
  // 这解释了「明明改好了却还是老样子」：宿主 JS 只在窗口启动时 require 一次，
  // 而 panel.html 每次开面板都从磁盘现读 —— 于是页面是新的、宿主是旧的。
  function renderDiag() {
    const el = $('#diag');
    if (!S.staleHost) {
      el.classList.add('hidden');
      el.textContent = '';
      return;
    }
    el.classList.remove('hidden');
    el.innerHTML =
      '<b>宿主代码是旧版</b> —— 页面（panel.html）是刚从磁盘读的新版，但扩展宿主的 ' +
      '<code>extension.js</code> 只在窗口启动时加载一次，所以「主机侧」的新改动（Δ=0 过滤、' +
      'Ctrl+L 送 Chat 的新逻辑、弹窗策略）都还没生效。<br>' +
      '按 <code>Ctrl+Shift+P</code> → <code>Developer: Reload Window</code> 后重新 <code>Alt+Q</code> 即可。' +
      '<button id="diag-reload">重载窗口</button>';
    const btn = $('#diag-reload');
    if (btn) btn.addEventListener('click', () => vscode.postMessage({ type: 'reloadWindow' }));
  }

  // 宿主下发的原始文件列表 → 面板要显示的文件列表。
  // 老宿主不过滤 Δ=0（纯重命名 / 仅权限变更）；新宿主已经在 toViewModel 里滤过了，
  // 判据：新宿主一定会带上 hiddenUnchanged 字段（哪怕是 0），老宿主不会。
  function normalizeFiles(c) {
    const all = c.files || [];
    const hostFiltered = typeof c.hiddenUnchanged === 'number';
    const noContent = (f) => !f.binary && !f.added && !f.deleted;
    if (hostFiltered) return { files: all, hiddenUnchanged: c.hiddenUnchanged || 0 };
    const files = all.filter((f) => !noContent(f));
    return { files, hiddenUnchanged: all.length - files.length };
  }

  // ---------- 多文档（页签） ----------
  // 每打开一笔 diff 就是一份文档，后面打开的不再覆盖前面的；顶部出现页签栏，
  // 点谁切谁。每份文档各自记着「看到哪个文件、滚到哪儿」，切回来不丢位置。
  function docOf(id) {
    return S.docs.find((d) => d.id === id) || null;
  }

  function captureView() {
    const d = docOf(S.activeId);
    if (!d) return;
    // expand 记在 view 上：重读 / 切文件之后，已经展开的缝不要自动合上。
    const expand = (d.view && d.view.expand) || {};
    d.view = {
      idx: S.idx,
      // 文件顺序会变（改动被提交掉、新文件加进来、重命名），只记下标不牢靠：
      // 记下路径，还原时优先按路径找回原来那个文件，找不到才退回下标。
      path: (curFile() || {}).path || '',
      open: S.open,
      hunkIdx: S.hunkIdx,
      chgIdx: S.chgIdx,
      lastSel: S.lastSel,
      expand,
      scroll: (() => {
        const b = $('#diffbody');
        return b ? b.scrollTop : 0;
      })(),
      // 光记像素不够：重算后上面可能多了/少了几行（或整个 hunk 变了），同一个像素位置
      // 会落到另一行上去。所以连「停在文件的第几行」一起记，还原时优先按行锚定。
      topLine: topVisibleLine(),
    };
  }

  function expandMap() {
    const d = docOf(S.activeId);
    if (d) {
      if (!d.view) d.view = {};
      if (!d.view.expand) d.view.expand = {};
      return d.view.expand;
    }
    return S._expand || (S._expand = {});
  }

  function fileExpand(filePath) {
    const map = expandMap();
    const k = filePath || '';
    if (!map[k]) map[k] = { full: false, ids: {} };
    if (!map[k].ids) map[k].ids = {};
    return map[k];
  }

  function blobKey(filePath) {
    return String(S.activeId || '') + ':' + String(filePath || '');
  }

  function getBlob(filePath) {
    return S.blobs[blobKey(filePath)] || null;
  }

  function clearBlobsFor(docId) {
    const prefix = String(docId || '') + ':';
    for (const k of Object.keys(S.blobs)) {
      if (k.startsWith(prefix)) delete S.blobs[k];
    }
  }

  function requestFileBlob(f) {
    if (!f || !f.path) return;
    const key = blobKey(f.path);
    const cur = S.blobs[key];
    if (cur && cur.pending) return;
    if (cur && !cur.error && cur.newLines) return;
    S.blobs[key] = { pending: true };
    if (cur && cur._t) clearTimeout(cur._t);
    S.blobs[key]._t = setTimeout(() => {
      const b = S.blobs[key];
      if (b && b.pending) {
        S.blobs[key] = { error: '宿主没回应（需要 Reload Window）' };
        toast('展开失败：宿主是旧版，先 Reload Window');
        showStatus('');
        renderDiff({ keepScroll: true });
      }
    }, 4000);
    showStatus('正在读取原文以便展开…', 'loading');
    vscode.postMessage({ type: 'fileBlob', path: f.path, oldPath: f.oldPath || f.path });
  }

  function onFileBlob(m) {
    const key = blobKey(m.path);
    const prev = S.blobs[key];
    if (prev && prev._t) clearTimeout(prev._t);
    showStatus('');
    if (m.error) {
      S.blobs[key] = { error: String(m.error) };
      toast('展开失败：' + m.error);
      const f = curFile();
      if (f && f.path === m.path) {
        const st = fileExpand(f.path);
        st.full = false;
      }
      return;
    }
    S.blobs[key] = {
      newLines: splitSourceLines(m.newText),
      oldLines: splitSourceLines(m.oldText),
    };
    const f = curFile();
    if (f && f.path === m.path && S.open) renderDiff({ keepScroll: true });
  }

  function ensureBlobThenRender(f) {
    if (!f) return;
    const b = getBlob(f.path);
    if (b && b.pending) return;
    if (b && b.error) {
      toast('展开失败：' + b.error);
      return;
    }
    if (b && b.newLines) {
      renderDiff({ keepScroll: true });
      return;
    }
    requestFileBlob(f);
  }

  function anyGapOpen(f) {
    if (!f) return false;
    const st = fileExpand(f.path);
    return !!(st.full || Object.keys(st.ids || {}).length);
  }

  function openGap(f, gapId) {
    if (!f) return;
    const st = fileExpand(f.path);
    st.ids[gapId] = true;
    ensureBlobThenRender(f);
  }

  function closeGap(f, gapId) {
    if (!f) return;
    const st = fileExpand(f.path);
    if (st.full) {
      // 全文展开时收起一条：其余缝保持开着，不要一把全合上
      st.full = false;
      st.ids = {};
      const blob = getBlob(f.path);
      const oldLen = blob && blob.oldLines ? blob.oldLines.length : 0;
      const newLen = blob && blob.newLines ? blob.newLines.length : 0;
      for (const g of hunkGaps(f.hunks, oldLen, newLen)) {
        if (g.id !== gapId) st.ids[g.id] = true;
      }
    } else if (st.ids) {
      delete st.ids[gapId];
    }
    renderDiff({ keepScroll: true });
  }

  function toggleExpandAll(f) {
    if (!f || f.binary || !f.hunks || !f.hunks.length) {
      toast('这个文件没有可展开的源码');
      return;
    }
    const st = fileExpand(f.path);
    // 点过单条缝也算「已经展开」：再点 e / 头上的按钮要能收回去，不能只认 full
    if (anyGapOpen(f)) {
      st.full = false;
      st.ids = {};
      renderDiff({ keepScroll: true });
      return;
    }
    st.full = true;
    ensureBlobThenRender(f);
  }

  function renderTabs() {
    const bar = $('#tabs');
    if (!bar) return;
    // 原生标签模式（宿主默认）：每个 diff 都是 Cursor 自己的标签页，
    // 页面里再画一排页签就成了「标签套标签」，纯属碍眼 —— 这一行永远不出现。
    // 切换标签、关标签都由 Cursor 负责（关标签 = 关掉这个面板）。
    if (S.nativeTabs || S.docs.length < 2) {
      bar.className = 'hidden';
      bar.textContent = '';
      return;
    }
    // 只有一份文档时不占那一行（看起来还是原来单笔的样子）；两笔以上才出现页签栏
    if (S.docs.length < 2) {
      bar.className = 'hidden';
      bar.textContent = '';
      return;
    }
    bar.className = '';
    const frag = document.createDocumentFragment();
    for (const d of S.docs) {
      const t = document.createElement('span');
      t.className = 'tab' + (d.id === S.activeId ? ' active' : '');
      t.title = `${d.shortSha}  ${d.subject}\n${d.working ? '工作区改动' : '提交'} · 点击切换（x 关闭本页签）`;
      const sha = document.createElement('span');
      sha.className = 't-sha';
      sha.textContent = d.shortSha || '?';
      const sub = document.createElement('span');
      sub.className = 't-sub';
      sub.textContent = d.subject || '';
      const x = document.createElement('button');
      x.className = 't-x';
      x.textContent = '\u2715';
      x.title = '关闭这个页签（x）';
      t.append(sha, sub, x);
      t.addEventListener('click', (e) => {
        if (e.target === x) { closeDoc(d.id); return; }
        activateDoc(d.id);
      });
      frag.appendChild(t);
    }
    bar.textContent = '';
    bar.appendChild(frag);
    const act = bar.querySelector('.tab.active');
    if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function activateDoc(id) {
    if (id === S.activeId) return;
    const d = docOf(id);
    if (!d) return;
    captureView();
    S.activeId = id;
    applyDoc(d);
    renderTabs();
    vscode.postMessage({ type: 'activateDoc', docId: id });
  }

  function closeDoc(id) {
    const i = S.docs.findIndex((d) => d.id === id);
    if (i < 0) return;
    const wasActive = S.activeId === id;
    S.docs.splice(i, 1);
    vscode.postMessage({ type: 'closeDoc', docId: id });
    if (!wasActive) { renderTabs(); return; }
    const next = S.docs[Math.min(i, S.docs.length - 1)];
    if (!next) {
      // 最后一份也关了：面板没有可显示的内容，直接关掉（和关掉最后一个编辑器标签一致）
      S.activeId = null;
      vscode.postMessage({ type: 'close' });
      return;
    }
    S.activeId = next.id;
    applyDoc(next);
    renderTabs();
  }

  function closeActiveDoc() {
    if (S.activeId) closeDoc(S.activeId);
    else vscode.postMessage({ type: 'close' });
  }

  // 把一份文档的数据铺到「实时视图」上并整体重绘
  function applyDoc(d) {
    const c = d.commit || {};
    const norm = normalizeFiles(c);
    S.files = norm.files;
    S.hiddenUnchanged = norm.hiddenUnchanged;
    S.symbolOnly = Array.isArray(c.symbolOnly) ? c.symbolOnly : [];
    S.symbolsIgnored = c.symbolsIgnored !== false;
    const v = d.view || {};
    // 还原「你刚才在看哪儿」。注意这里必须能撑住「同一份 diff 被重算」这种情况
    // （按 r 刷新、切 ¶、宿主在文件保存后自动重读）：那种场景下 v 是刚被 captureView
    // 写进来的当前值，所以位置不会丢；以前只在切换文档时 captureView，于是重算后
    // v.idx 是 undefined → 被拉回第一个文件、滚回顶部。
    let idx = -1;
    if (v.path) idx = S.files.findIndex((x) => x.path === v.path);
    if (idx < 0) idx = Math.max(0, Math.min(Number(v.idx) || 0, Math.max(0, S.files.length - 1)));
    S.idx = idx;
    S.open = v.open !== false;
    S.hunkIdx = Number(v.hunkIdx) || 0;
    S.chgIdx = -1;
    S.changeBlocksCache = null;
    S.lastSel = null;
    S.delta = c.delta || 0;
    S.shortSha = d.shortSha || '';
    S.subject = d.subject || '';
    S.note = c.note || '';
    S.isWorking = !!d.working;
    renderDiag();
    $('#commit-meta').textContent = `${S.shortSha}  ${S.subject}`;
    const sb = [];
    sb.push(`Δ=${S.delta}`);
    sb.push(`+${c.adds} / −${c.dels}`);
    const shown = S.files.length;
    const total = c.totalFiles || shown;
    sb.push(shown === total ? `${shown} 个文件` : `${shown}/${total} 个文件`);
    if (S.hiddenUnchanged > 0) sb.push(`省略 ${S.hiddenUnchanged} 个无内容变化文件`);
    if (S.symbolOnly.length) sb.push(`忽略 ${S.symbolOnly.length} 个只差符号/空白的文件`);
    if (d.working) sb.push('工作区 diff');
    $('#commit-sub').textContent = sb.join('   ·   ');
    showStatus('');
    renderHeader();
    renderList();
    renderDiff();
    const b = $('#diffbody');
    if (b) {
      // 优先按「你刚才停在哪一行」还原（内容变了也不会漂），退回按像素。
      if (!scrollToLine(Number(v.topLine)) && Number(v.scroll) > 0) b.scrollTop = Number(v.scroll);
    }
  }

  function applyCommit(c, hostVersion, docId, nativeTabs) {
    // 宿主 JS 是旧版时（改了 extension.js 但没 Reload Window），hostVersion 不会来。
    // panel.html 是每次打开面板时从磁盘现读的，所以只有页面这边能发现这件事 —— 必须主动提示，
    // 否则「改了没生效」会被误判成「功能没做」。
    S.staleHost = !hostVersion;
    S.hostVersion = hostVersion || '';
    // 宿主把每个 diff 都开成了独立的 Cursor 编辑器标签 → 页面内部不再画页签栏
    S.nativeTabs = !!nativeTabs;
    const hb = $('#host-build');
    if (hb) hb.textContent = hostVersion ? `宿主 ${hostVersion}` : '宿主 旧版(未重载)';
    const id = String(docId || c.docId || (c.sha ? 'sha:' + c.sha : (c.shortSha || ':unknown:')));
    // 先把「现在看到的是哪个文件、滚到哪儿」记下来 —— 不管是切文档还是同一个文档重算。
    // 同一个文档重算（手动 r 刷新 / 切 ¶ / 宿主在存盘后自动重读）也必须保住位置，
    // 否则 applyDoc 读到的 v.idx 是空的，会把人拉回第一个文件、滚回顶部。
    captureView();
    clearBlobsFor(id); // 重算后原文可能变了，展开用的缓存作废（展开开关还在 view.expand 里）
    let d = docOf(id);
    if (!d) {
      d = { id, view: {} };
      S.docs.push(d);
    }
    d.commit = c;
    d.shortSha = c.shortSha || '';
    d.subject = c.subject || '';
    d.working = !!c.working || String(c.sha || '').startsWith(':working:');
    S.activeId = id;
    applyDoc(d);
    renderTabs();
  }

  // ---------- 顶栏 ----------
  function renderHeader() {
    const f = curFile();
    const hasCommit = !!S.shortSha;
    const whole = $('#btn-analyze');
    whole.disabled = S.busy || !hasCommit;
    whole.textContent = S.busy ? '分析中…' : '整笔分析';

    // 单文件分析需要有选中的文件，且该文件确实有可看的 diff
    const file = $('#btn-analyze-file');
    const canFile = !S.busy && hasCommit && !!f && !f.binary && f.hunks.length > 0;
    file.disabled = !canFile;
    file.title = !hasCommit
      ? '还没有打开提交'
      : !f
        ? '先选中一个文件'
        : f.binary
          ? '二进制文件没有可分析的 diff'
          : !f.hunks.length
            ? '该文件没有行级改动'
            : `分析 ${f.path}（Shift+F）；代码量大时先提示`;

    // 明确告诉用户：不会自动发送，点按钮才分析
    $('#ai-hint').textContent = hasCommit ? `按需分析 · Δ=${S.delta}` : '';

    const n = S.files.length;
    $('#btn-prev-file').disabled = !hasCommit || n < 2 || S.idx <= 0;
    $('#btn-next-file').disabled = !hasCommit || n < 2 || S.idx >= n - 1;
    $('#btn-prev-chg').disabled = !hasCommit;
    $('#btn-next-chg').disabled = !hasCommit;
    $('#btn-list').disabled = false;
  }

  function stepFile(dir) {
    if (!S.files.length) return;
    const next = S.idx + dir;
    if (next < 0 || next >= S.files.length) {
      toast(dir > 0 ? '已经是最后一个文件' : '已经是第一个文件');
      return;
    }
    S.idx = next;
    S.hunkIdx = 0;
    S.open = true;
    renderList();
    renderDiff();
    renderHeader();
  }

  // ---------- 左列表 ----------
  function renderList() {
    const list = $('#list');
    list.textContent = '';
    if (!S.files.length) {
      const d = document.createElement('div');
      d.id = 'listEmpty';
      d.textContent = !S.shortSha ? '（数据未到）' : S.hiddenUnchanged > 0 ? '（只有纯重命名/权限变更）' : '（无文件改动）';
      list.appendChild(d);
      return;
    }
    S.files.forEach((f, i) => {
      const row = document.createElement('div');
      row.className = 'frow' + (i === S.idx ? ' active' : '');
      row.dataset.idx = String(i);

      const g = document.createElement('span');
      g.className = 'glyph';
      g.textContent = STATUS_GLYPH[f.status] || '?';
      g.title = STATUS_NAME[f.status] || f.status;

      const p = document.createElement('span');
      p.className = 'fpath';
      p.textContent = f.path;
      p.title = `${f.path}\n${STATUS_NAME[f.status] || f.status}` + (f.binary ? '\n（二进制）' : '');

      const st = document.createElement('span');
      st.className = 'fstats';
      if (!f.binary) {
        const a = document.createElement('span');
        a.className = 'add-c';
        a.textContent = `+${f.added}`;
        const d2 = document.createElement('span');
        d2.className = 'del-c';
        d2.textContent = `−${f.deleted}`;
        st.appendChild(a);
        st.appendChild(document.createTextNode(' '));
        st.appendChild(d2);
      } else {
        st.textContent = 'bin';
        st.title = '二进制';
      }
      row.appendChild(g);
      row.appendChild(p);
      row.appendChild(st);
      list.appendChild(row);
    });
  }

  // ---------- 右侧 diff ----------
  function curFile() { return S.files[S.idx]; }
  function curFileHunks() { const f = curFile(); return f ? f.hunks : []; }

  function lineKind(raw) {
    const c = raw[0];
    return c === '+' ? 'add' : c === '-' ? 'del' : c === '\\' ? 'nonl' : 'ctx';
  }

  // 从 hunk 头 `@@ -12,7 +12,9 @@` 的起点逐行推行号。
  // 删除行只给旧行号、新增行只给新行号（Gerrit 靠这一点区分增删）；
  // "\ No newline at end of file" 独立成行、不占号也不显示行号。
  // 头不合常规就 has=false：整段不显示行号、正文保留原始前缀，不许猜。
  function lineNumbers(h) {
    const rows = [];
    const m = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(h.header);
    if (!m) {
      for (const raw of h.lines) {
        if (raw === '') continue;
        rows.push({ raw, kind: lineKind(raw), old: '', new: '' });
      }
      return { has: false, rows };
    }
    let oldNo = Number(m[1]);
    let newNo = Number(m[2]);
    for (const raw of h.lines) {
      // 空串是 diff 末尾换行 split 出来的尾巴（老版宿主会带下来）。跳过，
      // 否则最后会多出一行"有行号但没内容"的幽灵行。
      if (raw === '') continue;
      const kind = lineKind(raw);
      if (kind === 'nonl') rows.push({ raw, kind, old: '', new: '' });
      else if (kind === 'add') rows.push({ raw, kind, old: '', new: String(newNo++) });
      else if (kind === 'del') rows.push({ raw, kind, old: String(oldNo++), new: '' });
      else rows.push({ raw, kind, old: String(oldNo++), new: String(newNo++) });
    }
    return { has: true, rows };
  }

  // 「这一行对应工作区文件的第几行」——点行号跳原文时用（见 .ln[data-ln-jump]）。
  // 新增/上下文行好办，用自己的新行号；**删除行在新文件里没有行号**，这时不能拿旧行号
  // 去跳（旧行号是「改动前」的坐标系，跳到新文件里会落到错位置），而是取「这段改动消失的位置」：
  // 优先后面最近的新行号，后面没有（删到文件尾）再退回前面最近的。两边都没有才不给跳。
  function fillJumpTargets(rows) {
    let after = null;
    for (let i = rows.length - 1; i >= 0; i--) {
      const r = rows[i];
      if (r.new) { r.jump = Number(r.new); after = r.jump; }
      else r.jump = after;
    }
    let before = null;
    for (const r of rows) {
      if (r.new) before = Number(r.new);
      else if (r.jump == null) r.jump = before;
    }
    return rows;
  }

  // 行号列宽度按「本文件出现过的最大行号位数」自适应，短文件列不会白白很宽
  function gutterDigits(hunks, oldLen, newLen) {
    let max = 1;
    for (const h of hunks) {
      const m = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/.exec(h.header);
      if (!m) continue;
      max = Math.max(max, Number(m[1]) + Number(m[2] || 0), Number(m[3]) + Number(m[4] || 0));
    }
    if (oldLen) max = Math.max(max, oldLen);
    if (newLen) max = Math.max(max, newLen);
    return String(max).length;
  }

  // ---------- 把 git 省略的源码补回 diff ----------
  // 宿主给的是 --unified=3 的改动岛。岛与岛之间的行号是连续的，中间那段没发给我们。
  // 展开 = 按行号从新旧两侧原文切片，当成普通上下文行插进去（行首空格，送 Chat 才合法）。
  function splitSourceLines(text) {
    if (text == null || text === '') return [];
    const parts = String(text).split('\n');
    if (parts.length && parts[parts.length - 1] === '') parts.pop();
    return parts;
  }

  function parseHunkSpan(header) {
    const m = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/.exec(header || '');
    if (!m) return null;
    const oldStart = Number(m[1]);
    const oldCount = m[2] !== undefined ? Number(m[2]) : 1;
    const newStart = Number(m[3]);
    const newCount = m[4] !== undefined ? Number(m[4]) : 1;
    return {
      oldStart,
      oldCount,
      newStart,
      newCount,
      oldEnd: oldStart === 0 ? 0 : oldStart + oldCount - 1,
      newEnd: newStart === 0 ? 0 : newStart + newCount - 1,
    };
  }

  function hunkGaps(hunks, oldLen, newLen) {
    const spans = [];
    for (const h of hunks || []) {
      const s = parseHunkSpan(h.header);
      if (s) spans.push(s);
    }
    const gaps = [];
    if (!spans.length) return gaps;
    const first = spans[0];
    if (first.oldStart > 1 || first.newStart > 1) {
      gaps.push({
        id: 'head',
        after: -1,
        oldFrom: first.oldStart > 0 ? 1 : 0,
        oldTo: first.oldStart > 1 ? first.oldStart - 1 : 0,
        newFrom: first.newStart > 0 ? 1 : 0,
        newTo: first.newStart > 1 ? first.newStart - 1 : 0,
      });
    }
    for (let i = 0; i < spans.length - 1; i++) {
      const a = spans[i];
      const b = spans[i + 1];
      const oldFrom = a.oldEnd + 1;
      const oldTo = b.oldStart - 1;
      const newFrom = a.newEnd + 1;
      const newTo = b.newStart - 1;
      if (oldFrom <= oldTo || newFrom <= newTo) {
        gaps.push({ id: i + '-' + (i + 1), after: i, oldFrom, oldTo, newFrom, newTo });
      }
    }
    const last = spans[spans.length - 1];
    const oldFrom = last.oldEnd + 1;
    const newFrom = last.newEnd + 1;
    const oLen = Number(oldLen) || 0;
    const nLen = Number(newLen) || 0;
    if (oLen || nLen) {
      if (oldFrom <= oLen || newFrom <= nLen) {
        gaps.push({
          id: 'tail',
          after: spans.length - 1,
          oldFrom,
          oldTo: oLen,
          newFrom,
          newTo: nLen,
        });
      }
    }
    return gaps;
  }

  function gapLineCount(g) {
    const oldN = g.oldFrom > 0 && g.oldTo >= g.oldFrom ? g.oldTo - g.oldFrom + 1 : 0;
    const newN = g.newFrom > 0 && g.newTo >= g.newFrom ? g.newTo - g.newFrom + 1 : 0;
    return Math.max(oldN, newN);
  }

  function ctxRowsForGap(gap, oldLines, newLines) {
    const oldN = gap.oldFrom > 0 && gap.oldTo >= gap.oldFrom ? gap.oldTo - gap.oldFrom + 1 : 0;
    const newN = gap.newFrom > 0 && gap.newTo >= gap.newFrom ? gap.newTo - gap.newFrom + 1 : 0;
    const n = Math.max(oldN, newN);
    const rows = [];
    const olds = oldLines || [];
    const news = newLines || [];
    for (let i = 0; i < n; i++) {
      const o = i < oldN ? gap.oldFrom + i : 0;
      const nw = i < newN ? gap.newFrom + i : 0;
      const text = nw ? (news[nw - 1] != null ? news[nw - 1] : '') : (olds[o - 1] != null ? olds[o - 1] : '');
      if (i < oldN && i < newN) {
        rows.push({ raw: ' ' + text, kind: 'ctx', old: String(o), new: String(nw) });
      } else if (i < newN) {
        rows.push({ raw: '+' + text, kind: 'add', old: '', new: String(nw) });
      } else {
        rows.push({ raw: '-' + text, kind: 'del', old: String(o), new: '' });
      }
    }
    fillJumpTargets(rows);
    return rows;
  }

  // ---------- 语法着色（Gerrit / CodeMirror default 主题风格） ----------
  // 白底上用灰绿斜体：比正文浅、又不跟新增的绿底抢；红底删除行上同样能认出来。
  // 字符串里的 // 和 http:// 不当注释；跨 hunk 的块注释不跟踪（diff 会跳行，状态会错）。
  function langStyle(path) {
    const base = String(path || '').split('/').pop().toLowerCase();
    const ext = base.split('.').pop();
    const hash = 'py sh bash zsh rb yml yaml toml r pl pm php cmake mk lock service gitignore editorconfig ini cfg';
    // 靠文件名而不是扩展名认出来的：# 注释的那些（Makefile / CMakeLists.txt / .env …）
    const hashNames = 'makefile gnumakefile cmakelists.txt dockerfile vagrantfile rakefile gemfile ' +
      '.bashrc .zshrc .profile .bash_profile .env .gitconfig .editorconfig .npmrc';
    const xml = 'html htm xml svg vue xhtml';
    const sql = 'sql';
    const lua = 'lua';
    if ((' ' + hashNames + ' ').includes(' ' + base + ' ')) return 'hash';
    if ((' ' + hash + ' ').includes(' ' + ext + ' ') || ext === 'dockerfile') return 'hash';
    if ((' ' + xml + ' ').includes(' ' + ext + ' ')) return 'xml';
    if (ext === sql) return 'sql';
    if (ext === lua) return 'lua';
    return 'c';
  }

  // ---------- 语法着色 ----------
  // 逐行、无状态：diff 的 hunk 会跳行，跨行跟踪状态（比如多行块注释）在 diff 里必然出错，
  // 所以块注释只按「这一行里成对出现」处理，字符串同理。
  // 字体族只影响观感，不影响语义 —— 认不出的语言一律按 c 系处理。
  const KW_WORDS =
    'auto break case const continue default do else enum extern for goto if inline register restrict ' +
    'return sizeof static struct switch typedef union volatile while _Bool _Atomic _Static_assert ' +
    'alignas alignof asm bool complex generic imag noreturn static_assert thread_local typeof ' +
    'catch class constexpr const_cast decltype delete dynamic_cast explicit export extern false ' +
    'friend mutable namespace new noexcept nullptr operator override private protected public ' +
    'reinterpret_cast static_cast template this throw true try typeid typename using virtual ' +
    'and or not in is None True False self elif except finally from global lambda nonlocal pass ' +
    'raise with yield as assert async await def import fn impl trait pub mod match loop where ' +
    'unsafe mut ref crate use super dyn let var function typeof instanceof extends implements ' +
    'interface package final void throw throws synchronized native transient strictfp';
  // 常见内置类型名（clangd/CodeMirror 也把它们归到「类型」色）
  const TYPE_WORDS =
    'int char short long float double signed unsigned void size_t ssize_t ptrdiff_t wchar_t ' +
    'int8_t int16_t int32_t int64_t uint8_t uint16_t uint32_t uint64_t intptr_t uintptr_t ' +
    'FILE bool string String Integer Float Double Object Array Map Set Promise Error List Dict ' +
    'u8 u16 u32 u64 i8 i16 i32 i64 f32 f64 usize isize str Vec Option Result Box';
  const KW_SET = new Set(KW_WORDS.split(' '));
  const TYPE_SET = new Set(TYPE_WORDS.split(' '));

  const ID_START = /[A-Za-z_$]/;
  const ID_CHAR = /[\w$]/;

  // 返回 [{t, cls}]：cls='' 表示按正文色渲染（调用方用纯文本节点，省节点数）
  function tokenize(s, style) {
    const out = [];
    let buf = '';
    const flush = (cls) => { if (buf) { out.push({ t: buf, cls: cls || '' }); buf = ''; } };

    const hashCmt = style === 'hash' || style === 'sql' || style === 'lua';
    const lineCmt = style === 'hash' ? '#' : hashCmt ? '--' : style === 'xml' ? null : '//';
    const block = style === 'hash' ? null : style === 'xml' ? ['<!--', '-->'] : ['/*', '*/'];
    const isLine = (mark, at) => {
      if (!mark || !s.startsWith(mark, at)) return false;
      if (at === 0) return true;
      const prev = s[at - 1];
      if (mark === '//') return prev !== ':';          // 放过 http://
      if (mark === '#' || mark === '--') return /\s/.test(prev);
      return true;
    };

    let i = 0;
    // c 系语言的行首预处理指令：#include / #define / #if…（只把 `#xxx` 染色，后面继续解析）
    if (style === 'c') {
      const m = /^(\s*#\s*[A-Za-z_]\w*)/.exec(s);
      if (m) { out.push({ t: m[1], cls: 'pre' }); i = m[1].length; }
    }

    while (i < s.length) {
      const c = s[i];

      // 字符串 / 字符字面量（转义序列单独染色，Gerrit 也是这样）
      if (c === '"' || c === "'" || c === '`') {
        flush('');
        let j = i + 1;      // 跳过起始引号；start 从引号本身算起
        let start = i;
        while (j < s.length) {
          const ch = s[j];
          if (ch === '\\') {
            if (j > start) out.push({ t: s.slice(start, j), cls: 'str' });
            const esc = s.slice(j, Math.min(s.length, j + 2));
            out.push({ t: esc, cls: 'esc' });
            j += esc.length;
            start = j;
            continue;
          }
          j++;
          if (ch === c) break;   // 收尾引号已经包含在 j 里
        }
        if (j > start) out.push({ t: s.slice(start, j), cls: 'str' });
        i = j;
        continue;
      }

      // 注释
      if (isLine(lineCmt, i)) {
        flush('');
        out.push({ t: s.slice(i), cls: 'cmt' });
        return out;
      }
      if (block && s.startsWith(block[0], i)) {
        flush('');
        const end = s.indexOf(block[1], i + block[0].length);
        if (end < 0) {
          out.push({ t: s.slice(i), cls: 'cmt' });
          return out;
        }
        out.push({ t: s.slice(i, end + block[1].length), cls: 'cmt' });
        i = end + block[1].length;
        continue;
      }

      // 数字常量
      if (c >= '0' && c <= '9') {
        const m = /^(0[xX][0-9a-fA-F_]+|0[bB][01_]+|\d[\d_]*(?:\.[\d_]*)?(?:[eE][+-]?\d+)?)[uUlLfF]*/.exec(s.slice(i));
        if (m) {
          flush('');
          out.push({ t: m[0], cls: 'num' });
          i += m[0].length;
          continue;
        }
      }

      // 标识符：关键字 / 类型 / 函数 / 成员
      if (ID_START.test(c)) {
        let j = i + 1;
        while (j < s.length && ID_CHAR.test(s[j])) j++;
        const word = s.slice(i, j);
        flush('');
        let cls = '';
        if (KW_SET.has(word)) cls = 'kw';
        else if (TYPE_SET.has(word)) cls = 'type';
        else {
          // 前面是 . 或 ->  → 成员访问
          const before = s.slice(0, i).replace(/\s+$/, '');
          if (before.endsWith('.') || before.endsWith('->')) cls = 'mem';
          else {
            // 后面跟 ( → 函数名/调用（控制流关键字已在 KW 里拦下）
            let k = j;
            while (k < s.length && (s[k] === ' ' || s[k] === '\t')) k++;
            if (s[k] === '(') cls = 'fn';
          }
        }
        out.push({ t: word, cls });
        i = j;
        continue;
      }

      buf += c;
      i++;
    }
    flush('');
    return out.length ? out : [{ t: s, cls: '' }];
  }

  function sourceBodyFromRaw(raw) {
    if (raw == null || raw === '') return '';
    if (raw[0] === '+' || raw[0] === '-' || raw[0] === ' ') return raw.slice(1);
    return raw;
  }

  function identifierAtColumn(body, col) {
    if (!body) return null;
    col = Math.max(0, Math.min(body.length, col));
    let s = col;
    let e = col;
    while (s > 0 && /[\w$]/.test(body[s - 1])) s--;
    while (e < body.length && /[\w$]/.test(body[e])) e++;
    if (s >= e) return null;
    return { start: s, end: e, word: body.slice(s, e) };
  }

  function offsetInCodeEl(codeEl, range) {
    const walker = document.createTreeWalker(codeEl, NodeFilter.SHOW_TEXT);
    let off = 0;
    let node;
    const target = range.startContainer;
    while ((node = walker.nextNode())) {
      if (node === target) {
        off += range.startOffset;
        break;
      }
      off += node.textContent.length;
    }
    return Math.max(0, off);
  }

  // 单页：直接用这一行自己的 old/new 行号；
  // 双页：按点到的那一侧取（左侧是旧文件的行号，右侧是新文件的行号）。
  function lineNumberForJump(lineEl, cellEl) {
    const side = cellEl && cellEl.classList && cellEl.classList.contains('side') ? cellEl : null;
    let ln;
    if (side) ln = side.classList.contains('left') ? lineEl.dataset.lnOld : lineEl.dataset.lnNew;
    else if (lineEl.classList.contains('del')) ln = lineEl.dataset.lnOld;
    else ln = lineEl.dataset.lnNew || lineEl.dataset.lnOld;
    const n = parseInt(ln, 10);
    return Number.isFinite(n) && n > 0 ? n : null;
  }

  // 这一行的代码正文：双页里一行左右两半内容不同，取点到的那一半
  function bodyForJump(lineEl, cellEl) {
    const raw = (cellEl && cellEl.dataset && cellEl.dataset.raw) || lineEl.dataset.raw || '';
    return sourceBodyFromRaw(raw);
  }

  function requestGoToSymbol(kind, lineEl, codeEl, clientX, clientY) {
    const f = curFile();
    if (!f || !lineEl || !codeEl) return;
    const cellEl = codeEl.closest ? codeEl.closest('.side') : null;
    const lineNo = lineNumberForJump(lineEl, cellEl);
    if (lineNo == null) {
      toast('这一行没有可对齐的行号');
      return;
    }
    const body = bodyForJump(lineEl, cellEl);
    const doc = codeEl.ownerDocument;
    let col = 0;
    if (doc.caretRangeFromPoint) {
      const range = doc.caretRangeFromPoint(clientX, clientY);
      if (range && codeEl.contains(range.startContainer)) col = offsetInCodeEl(codeEl, range);
    }
    const id = identifierAtColumn(body, col);
    if (!id || id.word.length < 2) {
      toast('请点在标识符（函数名/变量名）上');
      return;
    }
    vscode.postMessage({
      type: 'goToSymbol',
      kind,
      path: f.path,
      line: lineNo,
      character: id.start,
      historical: !S.isWorking,
    });
  }

  function goToFromSelection(kind) {
    const f = curFile();
    const body = $('#diffbody');
    if (!f || !body) return;
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) {
      toast('先选中 diff 里的标识符，或 Ctrl/Alt+点击');
      return;
    }
    const range = sel.getRangeAt(0);
    if (!body.contains(range.commonAncestorContainer)) return;
    const line = range.startContainer.nodeType === Node.ELEMENT_NODE
      ? range.startContainer.closest('.hl')
      : range.startContainer.parentElement && range.startContainer.parentElement.closest('.hl');
    const startEl = range.startContainer.nodeType === Node.ELEMENT_NODE
      ? range.startContainer
      : range.startContainer.parentElement;
    const cell = startEl && startEl.closest ? startEl.closest('.side') : null;
    const code = (cell ? cell.querySelector('.code') : null) || (line && line.querySelector('.code'));
    if (!line || !code) return;
    const lineNo = lineNumberForJump(line, cell);
    if (lineNo == null) return;
    const srcBody = bodyForJump(line, cell);
    const col = offsetInCodeEl(code, range);
    const id = identifierAtColumn(srcBody, col);
    if (!id) {
      toast('选中的不是标识符');
      return;
    }
    vscode.postMessage({
      type: 'goToSymbol',
      kind,
      path: f.path,
      line: lineNo,
      character: id.start,
      historical: !S.isWorking,
    });
  }

  const TOK_CLASS = {
    cmt: 'cmt', kw: 'tk-kw', type: 'tk-type', num: 'tk-num',
    str: 'tk-str', fn: 'tk-fn', mem: 'tk-mem', pre: 'tk-pre', esc: 'tk-esc',
  };

  function fillCode(el, raw, path) {
    el.textContent = '';
    if (raw == null || raw === '') return;
    // "\ No newline at end of file"：整行当注释淡化即可
    if (raw[0] === '\\') {
      const s = document.createElement('span');
      s.className = 'cmt';
      s.textContent = raw;
      el.appendChild(s);
      return;
    }
    const body = sourceBodyFromRaw(raw);
    // 两种着色都关掉时走最快路径：整行一个文本节点
    if (!S.colorComments && !S.syntaxHighlight) {
      el.appendChild(document.createTextNode(body));
      return;
    }
    for (const p of tokenize(body, langStyle(path))) {
      // 注释只看 colorComments，其它 token 只看 syntaxHighlight —— 两个开关互不牵连
      const on = p.cls === 'cmt' ? S.colorComments : S.syntaxHighlight;
      const cls = on ? p.cls : '';
      const cn = TOK_CLASS[cls];
      if (cn) {
        const s = document.createElement('span');
        s.className = cn;
        s.textContent = p.t;
        el.appendChild(s);
      } else {
        el.appendChild(document.createTextNode(p.t));
      }
    }
  }

  // ---------- 行 DOM 构造（单页 / 双页共用） ----------
  function makeHunkHead(h, hIdx) {
    const hh = document.createElement('div');
    hh.className = 'hh' + (hIdx === S.hunkIdx ? ' cur' : '');
    hh.dataset.h = String(hIdx);
    hh.textContent = h.header;
    hh.title = '当前 hunk：无选区按 c 即发送它';
    return hh;
  }

  function makeExpandBar(gap, f, opened) {
    const n = gapLineCount(gap);
    const bar = document.createElement('div');
    bar.className = opened ? 'hx hx-open' : 'hx';
    bar.dataset.gap = gap.id;
    const where = gap.id === 'head' ? '文件头' : gap.id === 'tail' ? '文件末尾' : '中间';
    const ico = document.createElement('span');
    ico.className = 'hx-ico';
    ico.textContent = opened ? '▲' : '▼';
    const label = document.createElement('span');
    const verb = opened ? '收起' : '展开';
    if (n > 0) {
      label.appendChild(document.createTextNode(verb + where + ' '));
      const num = document.createElement('span');
      num.className = 'hx-n';
      num.textContent = String(n);
      label.appendChild(num);
      label.appendChild(document.createTextNode(opened ? ' 行' : ' 行未改的源码'));
    } else {
      label.textContent = verb + where + (opened ? '的源码' : '省略的源码');
    }
    bar.appendChild(ico);
    bar.appendChild(label);
    bar.title = opened
      ? '点这里把这段补进去的源码收起来'
      : '点这里把 git 省略的上下文补进 diff（再点一次收起）';
    bar.addEventListener('click', (ev) => {
      ev.preventDefault();
      if (opened) closeGap(f, gap.id);
      else openGap(f, gap.id);
    });
    return bar;
  }

  // 一行 = 旧行号 | 新行号 | +/- | 正文
  function makeLine(r, path, hIdx) {
    const line = document.createElement('div');
    line.className = 'hl ' + r.kind;
    line.dataset.h = String(hIdx);
    // 渲染时把原始行存一份：行首多了两列行号，textContent 会变成
    // "7 8 const x = 1" 这种东西，送 Chat 必须用这份干净的原文（见 selectedLines）。
    line.dataset.raw = r.raw;
    if (r.old) line.dataset.lnOld = r.old;
    if (r.new) line.dataset.lnNew = r.new;
    // 这一行对应新文件的第几行（重算后按行还原滚动位置要用，见 scrollToLine）
    if (Number.isFinite(r.jump)) line.dataset.lnJump = String(r.jump);

    const oldLn = document.createElement('span');
    oldLn.className = 'ln ln-old';
    oldLn.textContent = r.old;
    const newLn = document.createElement('span');
    newLn.className = 'ln ln-new';
    newLn.textContent = r.new;
    // 行号点击 = 在编辑器里打开这个文件的这一行（精确到行，见 openSourceFile）。
    // 普通行号列本身没有别的用途，拿它当热区不冲突：点代码区仍是选文字。
    if (Number.isFinite(r.jump)) {
      const tip = S.isWorking
        ? `打开第 ${r.jump} 行（可编辑）`
        : `打开第 ${r.jump} 行（该提交时的快照，只读）；Alt+点击 = 打开当前工作区文件`;
      for (const el of [oldLn, newLn]) {
        el.dataset.lnJump = String(r.jump);
        el.title = tip;
      }
    }
    const sign = document.createElement('span');
    sign.className = 'sign';
    const rc = r.raw && r.raw.length ? r.raw[0] : ' ';
    if (rc === '+') {
      sign.textContent = '+';
      sign.classList.add('add-mark');
    } else if (rc === '-') {
